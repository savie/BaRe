name: Build BΛR☰ Namespace APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/namespace-barebackup
    paths:
      - "bare-implementation/**"
      - ".github/workflows/namespace-barebackup.yml"
      - "tools/native-jni-replacement/**"

permissions:
  contents: read

jobs:
  build-namespace-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout BΛR☰ implementation
        uses: actions/checkout@v4
        with:
          ref: feature/namespace-barebackup
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Download Apktool
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          java -jar apktool.jar --version
          sha256sum apktool.jar

      - name: Apply minimal package namespace changes
        shell: bash
        run: |
          set -euo pipefail
          cp -a bare-implementation build-src
          mkdir -p build
          git fetch --no-tags --depth=1 origin rewrite
          REWRITE_SHA="$(git rev-parse FETCH_HEAD)"
          echo "Resolved rewrite source commit: $REWRITE_SHA"
          git show "$REWRITE_SHA:app/google-services.json" > build/google-services.json
          git show "$REWRITE_SHA:app/src/main/res/values/strings.xml" > build/rewrite-strings.xml
          sha256sum build/google-services.json build/rewrite-strings.xml
          sha256sum tools/native-jni-replacement/native-lib.cpp
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          from xml.sax.saxutils import escape

          root = Path("build-src")
          firebase_json = json.loads(Path("build/google-services.json").read_text())
          project_info = firebase_json.get("project_info", {})
          clients = firebase_json.get("client", [])
          firebase_client = next(
              (item for item in clients
               if item.get("client_info", {}).get("android_client_info", {}).get("package_name")
               == "com.bareapps.barebackup"),
              None,
          )
          assert firebase_client is not None, (
              "rewrite/app/google-services.json has no client for com.bareapps.barebackup"
          )
          client_info = firebase_client.get("client_info", {})
          api_keys = firebase_client.get("api_key", [])
          assert client_info.get("mobilesdk_app_id"), "Firebase mobilesdk_app_id is missing"
          assert api_keys and api_keys[0].get("current_key"), "Firebase API key is missing"
          assert project_info.get("project_id") and project_info.get("project_number"), (
              "Firebase project_id/project_number is missing"
          )

          firebase_values = {
              "google_app_id": client_info["mobilesdk_app_id"],
              "google_api_key": api_keys[0]["current_key"],
              "gcm_defaultSenderId": project_info["project_number"],
              "project_id": project_info["project_id"],
          }
          if project_info.get("storage_bucket"):
              firebase_values["google_storage_bucket"] = project_info["storage_bucket"]
          if project_info.get("firebase_url"):
              firebase_values["firebase_database_url"] = project_info["firebase_url"]
          for oauth_client in firebase_client.get("oauth_client", []):
              if str(oauth_client.get("client_type")) == "3" and oauth_client.get("client_id"):
                  firebase_values["default_web_client_id"] = oauth_client["client_id"]
                  break

          values_dir = root / "res/values"
          values_dir.mkdir(parents=True, exist_ok=True)
          strings_path = values_dir / "strings.xml"
          strings_text = strings_path.read_text()

          # Carry over the user-facing strings from the rewrite branch while keeping
          # the resource identifiers expected by the decompiled APK's public.xml/Smali.
          rewrite_strings = Path("build/rewrite-strings.xml").read_text()
          renamed_keys = {
              "bare_backup": "swift_backup",
              "bare_backup_is_busy": "swift_backup_is_busy",
              "open_in_bare_backup": "open_in_swift_backup",
              "search_bare_backup": "search_swift_backup",
              "share_barebackup": "share_swiftbackup",
              "share_barebackup_msg": "share_swiftbackup_msg",
              "share_barebackup_subject": "share_swiftbackup_subject",
              "share_barelogger_archive_with_device_logcat": "share_swiftlogger_archive_with_device_logcat",
              "share_barelogger_text_only": "share_swiftlogger_text_only",
              "bare_labs": "swift_labs",
              "bare_labs_settings_summary": "swift_labs_settings_summary",
              "barelogger": "swiftlogger",
              "barelogger_info": "swiftlogger_info",
          }
          def get_string_body(xml_text, name):
              match = re.search(
                  rf'<string\s+name="{re.escape(name)}"[^>]*>(.*?)</string>',
                  xml_text, flags=re.DOTALL
              )
              return match.group(1) if match else None

          source_names = re.findall(r'<string\s+name="([^"]+)"', rewrite_strings)
          copied = 0
          missing = []
          for source_name in source_names:
              target_name = renamed_keys.get(source_name, source_name)
              body = get_string_body(rewrite_strings, source_name)
              if body is None:
                  continue
              target_pattern = (
                  rf'(<string\s+name="{re.escape(target_name)}"[^>]*>)(.*?)(</string>)'
              )
              strings_text, count = re.subn(
                  target_pattern,
                  lambda match, body=body: match.group(1) + body + match.group(3),
                  strings_text, count=1, flags=re.DOTALL
              )
              if count:
                  copied += 1
              elif source_name not in ("intro_feature_not_available_yet",):
                  missing.append(f"{source_name} -> {target_name}")
          assert copied >= 1300, f"Unexpectedly few rewrite strings copied: {copied}"
          assert not missing, "Rewrite strings missing from APK resource set: " + ", ".join(missing[:20])
          print(f"Applied {copied} user-facing strings from rewrite branch using existing APK resource keys.")

          # BΛR☰ branding is owned by bare-implementation. Re-apply these explicit
          # values after the rewrite overlay so upstream copy cannot silently revert them.
          branding_overrides = {
              "swift_backup": "BΛR☰",
              "open_in_swift_backup": "Open in BΛR☰",
              "share_swiftbackup_subject": "BΛR☰ - Simple, fast backup solution for Android",
          }
          for name, value in branding_overrides.items():
              pattern = rf'(<string\s+name="{re.escape(name)}"[^>]*>)(.*?)(</string>)'
              strings_text, count = re.subn(
                  pattern,
                  lambda match, value=value: match.group(1) + escape(value) + match.group(3),
                  strings_text, count=1, flags=re.DOTALL
              )
              assert count == 1, f"Could not apply BΛR☰ branding override for {name}"
          print("Applied implementation-owned BΛR☰ branding overrides after upstream string overlay.")

          for name, value in firebase_values.items():
              tag = (
                  f'<string name="{name}"[^>]*>.*?</string>'
              )
              new_tag = (
                  f'<string name="{name}" translatable="false">'
                  f'{escape(str(value))}</string>'
              )
              strings_text, count = re.subn(tag, lambda _match, new_tag=new_tag: new_tag,
                                            strings_text, count=1, flags=re.DOTALL)
              if count == 0:
                  assert strings_text.count("</resources>") == 1, (
                      "Expected one resources closing tag in strings.xml"
                  )
                  strings_text = strings_text.replace(
                      "</resources>", f"    {new_tag}\n</resources>", 1
                  )
          strings_path.write_text(strings_text)
          print("Applied Firebase values from rewrite/app/google-services.json to existing resources (values redacted).")

          manifest = root / "AndroidManifest.xml"
          text = manifest.read_text()
          old = 'package="org.swiftapps.swiftbackup"'
          new = 'package="com.bareapps.barebackup"'
          assert text.count(old) == 1, "Expected exactly one manifest package declaration"
          text = text.replace(old, new, 1)
          text = text.replace("org.swiftapps.swiftbackup.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
                              "com.bareapps.barebackup.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION")
          for suffix in ("fileprovider", "shizuku", "tedpermissionprovider", "androidx-startup"):
              text = text.replace(f'org.swiftapps.swiftbackup.{suffix}',
                                  f'com.bareapps.barebackup.{suffix}')
          manifest.write_text(text)

          # The decompiled reference manifest omitted FirebaseInitProvider, so explicitly
          # initialize Firebase at the start of Application.onCreate as a second safeguard.
          app_smali = root / "smali/org/swiftapps/swiftbackup/SwiftApp.smali"
          app_source = app_smali.read_text()
          on_create = ".method public final onCreate()V"
          start = app_source.find(on_create)
          assert start >= 0, "SwiftApp.onCreate() was not found"
          super_call = "    invoke-super {p0}, Landroid/app/Application;->onCreate()V"
          call_at = app_source.find(super_call, start)
          assert call_at >= 0, "SwiftApp.onCreate() super call was not found"
          call_end = call_at + len(super_call)
          firebase_init = (
              "\n\n    # Initialize the BΛR☰ Firebase project before any Firebase-backed "
              "class is touched.\n"
              "    invoke-static {p0}, Lcom/google/firebase/FirebaseApp;->initializeApp(Landroid/content/Context;)Lcom/google/firebase/FirebaseApp;\n"
              "    move-result-object v0"
          )
          app_source = app_source[:call_end] + firebase_init + app_source[call_end:]
          app_smali.write_text(app_source)

          strings = root / "res/values/strings.xml"
          st = strings.read_text()
          st, count = re.subn(r'(<string name="swift_backup">).*?(</string>)',
                              r'\1BΛR☰\2', st, count=1)
          assert count == 1, "Could not find default swift_backup app label"
          strings.write_text(st)

          apktool_yml = root / "apktool.yml"
          yml = apktool_yml.read_text()
          yml, code_count = re.subn(r'(?m)^  versionCode:.*$', '  versionCode: 102', yml, count=1)
          yml, name_count = re.subn(r'(?m)^  versionName:.*$', '  versionName: 1.0.2', yml, count=1)
          assert code_count == 1 and name_count == 1, "Could not update apktool version metadata"
          apktool_yml.write_text(yml)

          replacements = {
              "org.swiftapps.swiftbackup.fileprovider": "com.bareapps.barebackup.fileprovider",
              "org.swiftapps.swiftbackup.shizuku": "com.bareapps.barebackup.shizuku",
              "org.swiftapps.swiftbackup.tedpermissionprovider": "com.bareapps.barebackup.tedpermissionprovider",
              "org.swiftapps.swiftbackup.androidx-startup": "com.bareapps.barebackup.androidx-startup",
              "org.swiftapps.swiftbackup.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION": "com.bareapps.barebackup.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
          }
          for folder in ("smali", "smali_classes2", "smali_classes3", "smali_classes4", "res"):
              base = root / folder
              if not base.exists():
                  continue
              for path in base.rglob("*"):
                  if not path.is_file():
                      continue
                  try:
                      source = path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated = source
                  for a, b in replacements.items():
                      updated = updated.replace(a, b)
                  if updated != source:
                      path.write_text(updated)
          print("Package ID, app label, and version metadata updated; implementation class names intentionally preserved.")
          PY
          grep -q 'package="com.bareapps.barebackup"' build-src/AndroidManifest.xml
          grep -q 'name="google_app_id"' build-src/res/values/strings.xml
          grep -q 'name="google_api_key"' build-src/res/values/strings.xml
          grep -q 'FirebaseApp;->initializeApp(Landroid/content/Context;)Lcom/google/firebase/FirebaseApp;' build-src/smali/org/swiftapps/swiftbackup/SwiftApp.smali
          ! grep -q 'android:authorities="org.swiftapps.swiftbackup.fileprovider"' build-src/AndroidManifest.xml
          grep -q 'name="swift_backup">BΛR☰</string>' build-src/res/values/strings.xml
          grep -q 'versionCode: 102' build-src/apktool.yml
          grep -q 'versionName: 1.0.2' build-src/apktool.yml

      - name: Replace native library with reconstructed JNI implementation
        shell: bash
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/clang++"
          test -f tools/native-jni-replacement/native-lib.cpp
          mkdir -p build
          while IFS=: read -r abi target; do
            mkdir -p "build-src/lib/$abi"
            "$NDK_BIN/clang++" --target="$target" -fPIC -shared -std=c++17 -O2 \
              -Wall -Wextra -Werror=return-type -static-libstdc++ \
              tools/native-jni-replacement/native-lib.cpp \
              -o "build-src/lib/$abi/libnative-lib.so" \
              -landroid -ldl -llog
            "$NDK_BIN/llvm-readelf" -Ws "build-src/lib/$abi/libnative-lib.so" > "build/$abi-native-symbols.txt"
            "$NDK_BIN/llvm-readelf" -d "build-src/lib/$abi/libnative-lib.so" > "build/$abi-native-dynamic.txt"
            if grep -q 'NEEDED.*libc++_shared\.so' "build/$abi-native-dynamic.txt"; then
              echo "Unexpected libc++_shared.so dependency in reconstructed $abi library" >&2
              exit 1
            fi
            grep -q 'Java_org_swiftapps_swiftbackup_SwiftApp_getGoogleAuthAndroidClientId' "build/$abi-native-symbols.txt"
            grep -q 'Java_org_swiftapps_swiftbackup_SwiftApp_getGoogleAuthWebClientId' "build/$abi-native-symbols.txt"
            grep -q 'Java_org_swiftapps_swiftbackup_SwiftApp_isLocalNetworkTcpBlockedByPermission' "build/$abi-native-symbols.txt"
            if grep -q 'JNI_OnLoad' "build/$abi-native-symbols.txt"; then
              echo "Unexpected JNI_OnLoad found in reconstructed $abi library" >&2
              exit 1
            fi
            echo "Validated reconstructed native library for $abi ($target)"
          done <<'ABIS'
          arm64-v8a:aarch64-linux-android24
          armeabi-v7a:armv7a-linux-androideabi24
          x86:i686-linux-android24
          x86_64:x86_64-linux-android24
          ABIS
          sha256sum build-src/lib/*/libnative-lib.so
          "$NDK_BIN/clang++" --version | head -n 1
          "$NDK_BIN/llvm-readelf" --version | head -n 1

      - name: Rebuild unsigned APK
        run: |
          set -euo pipefail
          mkdir -p build
          java -jar apktool.jar b build-src --use-aapt2 --output build/barebackup-unsigned.apk
          unzip -t build/barebackup-unsigned.apk
          sha256sum build/barebackup-unsigned.apk
          ls -lh build/barebackup-unsigned.apk

      - name: Prepare stable CI signing key
        shell: bash
        env:
          BARE_DEBUG_KEYSTORE_B64: ${{ secrets.BARE_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$BARE_DEBUG_KEYSTORE_B64" || { echo "Missing BARE_DEBUG_KEYSTORE_B64 repository secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$BARE_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bare-ci.keystore"
          test -s "$RUNNER_TEMP/bare-ci.keystore"
          keytool -list -v -keystore "$RUNNER_TEMP/bare-ci.keystore" -alias androiddebugkey \
            -storepass android -keypass android | grep -E 'SHA1:|SHA-1:'

      - name: Align and sign APK with stable CI key
        shell: bash
        env:
          CI_KEYSTORE: ${{ runner.temp }}/bare-ci.keystore
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          echo "Selected Android build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/zipalign" -h 2>&1 | head -n 2 || true
          "$BUILD_TOOLS/apksigner" version
          "$BUILD_TOOLS/zipalign" -f 4 build/barebackup-unsigned.apk build/barebackup-aligned.apk
          python3 - <<'PY'
          import zipfile
          p = "build/barebackup-aligned.apk"
          with zipfile.ZipFile(p) as z:
              info = z.getinfo("resources.arsc")
              assert info.compress_type == zipfile.ZIP_STORED, f"resources.arsc is compressed: method={info.compress_type}"
              with open(p, "rb") as f:
                  f.seek(info.header_offset)
                  header = f.read(30)
                  assert header[:4] == bytes((0x50, 0x4b, 0x03, 0x04))
                  name_len = int.from_bytes(header[26:28], "little")
                  extra_len = int.from_bytes(header[28:30], "little")
                  data_offset = info.header_offset + 30 + name_len + extra_len
                  assert data_offset % 4 == 0, f"resources.arsc data offset is not 4-byte aligned: {data_offset}"
              print(f"resources.arsc is uncompressed and 4-byte aligned (offset {data_offset}).")
          PY
          "$BUILD_TOOLS/zipalign" -c -v 4 build/barebackup-aligned.apk
          sha256sum build/barebackup-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$CI_KEYSTORE" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out build/BaRe-namespace-signed.apk build/barebackup-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/BaRe-namespace-signed.apk
          sha256sum build/BaRe-namespace-signed.apk
          echo "Signing uses the stable BARE_DEBUG_KEYSTORE_B64 CI key shared with the rewrite rebuild workflow."

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: barebackup-namespace-test
          path: build/BaRe-namespace-signed.apk
          if-no-files-found: error
          retention-days: 14
