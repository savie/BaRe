name: Build BΛR☰ Namespace APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/native-jni-startup
    paths:
      - "reference/apktool/**"
      - ".github/workflows/namespace-barebackup.yml"
      - "tools/native-jni-replacement/**"

permissions:
  contents: read

jobs:
  build-namespace-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout decompiled reference
        uses: actions/checkout@v4
        with:
          ref: fix/native-jni-startup
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: 27.2.12479018

      - name: Download Apktool
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          java -jar apktool.jar --version

      - name: Apply minimal package namespace changes
        shell: bash
        run: |
          set -euo pipefail
          cp -a reference/apktool build-src
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build-src")
          manifest = root / "AndroidManifest.xml"
          text = manifest.read_text()
          old = 'package="org.swiftapps.swiftbackup"'
          new = 'package="com.bareapps.barebackup"'
          assert text.count(old) == 1, "Expected exactly one manifest package declaration"
          text = text.replace(old, new, 1)
          text = text.replace("org.swiftapps.swiftbackup.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
                              "com.bareapps.barebackup.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION")
          for suffix in ("fileprovider", "shizuku", "tedpermissionprovider", "androidx-startup"):
              text = text.replace(f'org.swiftapps.swiftbackup.{suffix}',
                                  f'com.bareapps.barebackup.{suffix}')
          manifest.write_text(text)

          strings = root / "res/values/strings.xml"
          st = strings.read_text()
          st, count = re.subn(r'(<string name="swift_backup">).*?(</string>)',
                              r'\1BΛR☰\2', st, count=1)
          assert count == 1, "Could not find default swift_backup app label"
          strings.write_text(st)

          apktool_yml = root / "apktool.yml"
          yml = apktool_yml.read_text()
          yml, code_count = re.subn(r'(?m)^  versionCode:.*$', '  versionCode: 102', yml, count=1)
          yml, name_count = re.subn(r'(?m)^  versionName:.*$', '  versionName: 1.0.2', yml, count=1)
          assert code_count == 1 and name_count == 1, "Could not update apktool version metadata"
          apktool_yml.write_text(yml)

          replacements = {
              "org.swiftapps.swiftbackup.fileprovider": "com.bareapps.barebackup.fileprovider",
              "org.swiftapps.swiftbackup.shizuku": "com.bareapps.barebackup.shizuku",
              "org.swiftapps.swiftbackup.tedpermissionprovider": "com.bareapps.barebackup.tedpermissionprovider",
              "org.swiftapps.swiftbackup.androidx-startup": "com.bareapps.barebackup.androidx-startup",
              "org.swiftapps.swiftbackup.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION": "com.bareapps.barebackup.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION",
          }
          for folder in ("smali", "smali_classes2", "smali_classes3", "smali_classes4", "res"):
              base = root / folder
              if not base.exists():
                  continue
              for path in base.rglob("*"):
                  if not path.is_file():
                      continue
                  try:
                      source = path.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated = source
                  for a, b in replacements.items():
                      updated = updated.replace(a, b)
                  if updated != source:
                      path.write_text(updated)
          print("Package ID, app label, and version metadata updated; implementation class names intentionally preserved.")
          PY
          grep -q 'package="com.bareapps.barebackup"' build-src/AndroidManifest.xml
          ! grep -q 'android:authorities="org.swiftapps.swiftbackup.fileprovider"' build-src/AndroidManifest.xml
          grep -q 'name="swift_backup">BΛR☰</string>' build-src/res/values/strings.xml
          grep -q 'versionCode: 102' build-src/apktool.yml
          grep -q 'versionName: 1.0.2' build-src/apktool.yml

      - name: Replace native library with reconstructed JNI implementation
        shell: bash
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/clang++"
          test -f tools/native-jni-replacement/native-lib.cpp
          mkdir -p build
          # Rebuild all packaged ABIs. This implementation intentionally has no JNI_OnLoad;
          # exported JNI names stay bound to the original SwiftApp class in the decoded APK.
          while IFS=: read -r abi target; do
            mkdir -p "build-src/lib/$abi"
            "$NDK_BIN/clang++" --target="$target" -fPIC -shared -std=c++17 -O2 \
              -Wall -Wextra -Werror=return-type \
              tools/native-jni-replacement/native-lib.cpp \
              -o "build-src/lib/$abi/libnative-lib.so" \
              -landroid -ldl -llog
            "$NDK_BIN/llvm-readelf" -Ws "build-src/lib/$abi/libnative-lib.so" > "build/$abi-native-symbols.txt"
            grep -q 'Java_org_swiftapps_swiftbackup_SwiftApp_getGoogleAuthAndroidClientId' "build/$abi-native-symbols.txt"
            grep -q 'Java_org_swiftapps_swiftbackup_SwiftApp_getGoogleAuthWebClientId' "build/$abi-native-symbols.txt"
            grep -q 'Java_org_swiftapps_swiftbackup_SwiftApp_isLocalNetworkTcpBlockedByPermission' "build/$abi-native-symbols.txt"
            if grep -q 'JNI_OnLoad' "build/$abi-native-symbols.txt"; then
              echo "Unexpected JNI_OnLoad found in reconstructed $abi library" >&2
              exit 1
            fi
            echo "Validated reconstructed native library for $abi ($target)"
          done <<'ABIS'
          arm64-v8a:aarch64-linux-android24
          armeabi-v7a:armv7a-linux-androideabi24
          x86:i686-linux-android24
          x86_64:x86_64-linux-android24
          ABIS
          mkdir -p build
          sha256sum build-src/lib/*/libnative-lib.so

      - name: Rebuild unsigned APK
        run: |
          set -euo pipefail
          mkdir -p build
          java -jar apktool.jar b build-src --use-aapt2 --output build/barebackup-unsigned.apk
          unzip -t build/barebackup-unsigned.apk
          ls -lh build/barebackup-unsigned.apk

      - name: Align and sign APK with a generated test key
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          keytool -genkeypair -keystore build/barebackup-test.jks -storepass changeit -keypass changeit \
            -alias barebackup -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BareBackup Test,O=BΛR☰,C=ID"
          "$BUILD_TOOLS/zipalign" -f 4 build/barebackup-unsigned.apk build/barebackup-aligned.apk
          python3 - <<'PY'
          import zipfile
          p = "build/barebackup-aligned.apk"
          with zipfile.ZipFile(p) as z:
              info = z.getinfo("resources.arsc")
              assert info.compress_type == zipfile.ZIP_STORED, f"resources.arsc is compressed: method={info.compress_type}"
              with open(p, "rb") as f:
                  f.seek(info.header_offset)
                  header = f.read(30)
                  assert header[:4] == bytes((0x50, 0x4b, 0x03, 0x04))
                  name_len = int.from_bytes(header[26:28], "little")
                  extra_len = int.from_bytes(header[28:30], "little")
                  data_offset = info.header_offset + 30 + name_len + extra_len
                  assert data_offset % 4 == 0, f"resources.arsc data offset is not 4-byte aligned: {data_offset}"
              print(f"resources.arsc is uncompressed and 4-byte aligned (offset {data_offset}).")
          PY
          "$BUILD_TOOLS/zipalign" -c -v 4 build/barebackup-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks build/barebackup-test.jks --ks-key-alias barebackup \
            --ks-pass pass:changeit --key-pass pass:changeit \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out build/BaRe-namespace-signed.apk build/barebackup-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/BaRe-namespace-signed.apk
          sha256sum build/BaRe-namespace-signed.apk
          echo "NOTE: CI generates an ephemeral test keystore. This APK is for testing only; future builds will have a different signer."

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: barebackup-namespace-test
          path: build/BaRe-namespace-signed.apk
          if-no-files-found: error
          retention-days: 14
