name: Build BΛR☰ Namespace APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/namespace-barebackup
    paths:
      - "bare-implementation/**"
      - ".github/workflows/namespace-barebackup.yml"
      - "tools/native-jni-replacement/**"

permissions:
  contents: read

jobs:
  build-namespace-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout BΛR☰ implementation
        uses: actions/checkout@v4
        with:
          ref: feature/namespace-barebackup
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Download Apktool
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          java -jar apktool.jar --version
          sha256sum apktool.jar

      - name: Inject Firebase config and validate implementation source
        shell: bash
        run: |
          set -euo pipefail
          cp -a bare-implementation build-src
          mkdir -p build
          git fetch --no-tags --depth=1 origin rewrite
          REWRITE_SHA="$(git rev-parse FETCH_HEAD)"
          echo "Resolved rewrite source commit: $REWRITE_SHA"
          git show "$REWRITE_SHA:app/google-services.json" > build/google-services.json
          sha256sum build/google-services.json
          sha256sum tools/native-jni-replacement/native-lib.cpp
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          from xml.sax.saxutils import escape

          root = Path("build-src")
          firebase_json = json.loads(Path("build/google-services.json").read_text())
          project_info = firebase_json.get("project_info", {})
          clients = firebase_json.get("client", [])
          firebase_client = next(
              (item for item in clients
               if item.get("client_info", {}).get("android_client_info", {}).get("package_name")
               == "com.bareapps.barebackup"),
              None,
          )
          assert firebase_client is not None, (
              "rewrite/app/google-services.json has no client for com.bareapps.barebackup"
          )
          client_info = firebase_client.get("client_info", {})
          api_keys = firebase_client.get("api_key", [])
          assert client_info.get("mobilesdk_app_id"), "Firebase mobilesdk_app_id is missing"
          assert api_keys and api_keys[0].get("current_key"), "Firebase API key is missing"
          assert project_info.get("project_id") and project_info.get("project_number"), (
              "Firebase project_id/project_number is missing"
          )

          firebase_values = {
              "google_app_id": client_info["mobilesdk_app_id"],
              "google_api_key": api_keys[0]["current_key"],
              "gcm_defaultSenderId": project_info["project_number"],
              "project_id": project_info["project_id"],
          }
          if project_info.get("storage_bucket"):
              firebase_values["google_storage_bucket"] = project_info["storage_bucket"]
          # Never infer a Realtime Database endpoint from a project ID:
          # Firebase projects may not have RTDB provisioned, and regional/legacy
          # instances do not necessarily use the default hostname. Only inject an
          # endpoint explicitly supplied by the project's configuration.
          if project_info.get("firebase_url"):
              firebase_values["firebase_database_url"] = project_info["firebase_url"]
          elif project_info.get("project_id") == "bare-6f8d6":
              # Explicit endpoint confirmed in the BΛR☰ Firebase Console (Singapore).
              # This is a configured project URL, not a hostname inferred from project ID.
              firebase_values["firebase_database_url"] = (
                  "https://bare-6f8d6-default-rtdb.asia-southeast1.firebasedatabase.app"
              )
          else:
              print("Firebase RTDB URL is not configured; not injecting a guessed endpoint.")
          for oauth_client in firebase_client.get("oauth_client", []):
              if str(oauth_client.get("client_type")) == "3" and oauth_client.get("client_id"):
                  firebase_values["default_web_client_id"] = oauth_client["client_id"]
                  break

          values_dir = root / "res/values"
          values_dir.mkdir(parents=True, exist_ok=True)
          strings_path = values_dir / "strings.xml"
          strings_text = strings_path.read_text()

          # Remove optional Firebase resources from any previous backend before injecting
          # this build's values. Missing keys must not leave Swift Backup Firebase endpoints behind.
          optional_firebase_keys = ("firebase_database_url", "google_storage_bucket", "default_web_client_id")
          for name in optional_firebase_keys:
              strings_text, _ = re.subn(
                  rf'<string\s+name="{re.escape(name)}"[^>]*>.*?</string>',
                  "",
                  strings_text,
                  count=1,
                  flags=re.DOTALL,
              )
          strings_path.write_text(strings_text)

          for name, value in firebase_values.items():
              tag = (
                  f'<string name="{name}"[^>]*>.*?</string>'
              )
              new_tag = (
                  f'<string name="{name}" translatable="false">'
                  f'{escape(str(value))}</string>'
              )
              strings_text, count = re.subn(tag, lambda _match, new_tag=new_tag: new_tag,
                                            strings_text, count=1, flags=re.DOTALL)
              if count == 0:
                  assert strings_text.count("</resources>") == 1, (
                      "Expected one resources closing tag in strings.xml"
                  )
                  strings_text = strings_text.replace(
                      "</resources>", f"    {new_tag}\n</resources>", 1
                  )
          strings_path.write_text(strings_text)
          print("Applied Firebase values from rewrite/app/google-services.json to existing resources (values redacted).")

          # The app package, authorities, app label, Firebase initialization, and version
          # metadata are source-controlled in bare-implementation. This step only injects
          # environment-specific Firebase values; it must not rewrite app implementation.
          manifest = (root / "AndroidManifest.xml").read_text()
          assert 'package="com.bareapps.barebackup"' in manifest
          assert 'android:authorities="com.bareapps.barebackup.fileprovider"' in manifest
          assert 'android:authorities="org.swiftapps.swiftbackup.fileprovider"' not in manifest
          strings_text = (root / "res/values/strings.xml").read_text()
          assert re.search(r'<string name="swift_backup">BΛR☰</string>', strings_text)
          assert 'name="google_app_id"' in strings_text
          assert 'name="google_api_key"' in strings_text
          app_smali = (root / "smali/org/swiftapps/swiftbackup/SwiftApp.smali").read_text()
          assert 'FirebaseApp;->initializeApp(Landroid/content/Context;)Lcom/google/firebase/FirebaseApp;' in app_smali
          apktool_yml = (root / "apktool.yml").read_text()
          assert re.search(r'(?m)^  versionCode: 102$', apktool_yml)
          assert re.search(r'(?m)^  versionName: 1.0.2$', apktool_yml)
          assert 'swift-backup-31751.firebaseio.com' not in strings_text, "Legacy Swift Backup Firebase URL remains in resources"
          assert 'swift-backup-31751.appspot.com' not in strings_text, "Legacy Swift Backup storage bucket remains in resources"
          assert 'swift-backup-31751.firebaseio.com' not in strings_text, "Legacy Swift Backup Firebase URL remains in resources"
          expected_database_url = project_info.get("firebase_url")
          if not expected_database_url and project_info.get("project_id") == "bare-6f8d6":
              expected_database_url = (
                  "https://bare-6f8d6-default-rtdb.asia-southeast1.firebasedatabase.app"
              )
          if expected_database_url:
              assert re.search(
                  r'<string name="firebase_database_url" translatable="false">'
                  + re.escape(escape(str(expected_database_url))) + r'</string>',
                  strings_text,
              ), "Configured Firebase Database URL was not injected"
          else:
              assert 'name="firebase_database_url"' not in strings_text, (
                  "Unconfigured Firebase Database URL must not be guessed or retained"
              )
          assert re.search(r'<string name="project_id" translatable="false">bare-6f8d6</string>', strings_text), "Expected BΛR☰ Firebase project_id was not injected"
          print("Validated source-controlled BΛR☰ implementation and injected Firebase runtime configuration.")
          PY
          grep -q 'package="com.bareapps.barebackup"' build-src/AndroidManifest.xml
          grep -q 'name="google_app_id"' build-src/res/values/strings.xml
          grep -q 'name="google_api_key"' build-src/res/values/strings.xml
          grep -q 'FirebaseApp;->initializeApp(Landroid/content/Context;)Lcom/google/firebase/FirebaseApp;' build-src/smali/org/swiftapps/swiftbackup/SwiftApp.smali
          ! grep -q 'android:authorities="org.swiftapps.swiftbackup.fileprovider"' build-src/AndroidManifest.xml
          grep -q 'name="swift_backup">BΛR☰</string>' build-src/res/values/strings.xml
          grep -q 'versionCode: 102' build-src/apktool.yml
          grep -q 'versionName: 1.0.2' build-src/apktool.yml

      - name: Validate premium-target features are free
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build-src/smali")
          secondary = Path("build-src/smali_classes2")

          def method_body(path, signature):
              source = path.read_text()
              match = re.search(
                  rf"(?ms)^\.method public final {re.escape(signature)}\n(.*?)^\.end method",
                  source,
              )
              assert match is not None, f"Missing method {signature} in {path}"
              return match.group(1)

          premium_state = method_body(root / "org/swiftapps/swiftbackup/common/V.smali", "getA()Z")
          assert re.search(r"(?m)^\s*const/4 p0, 0x1\s*$", premium_state), (
              "BΛR☰ global premium entitlement must be enabled"
          )

          folder_premium = method_body(
              secondary / "org/swiftapps/swiftbackup/settings/FolderBackupStrategy.smali",
              "isPremium()Z",
          )
          assert re.search(r"(?m)^\s*const/4 p0, 0x0\s*$", folder_premium), (
              "Incremental folder backup must be marked free"
          )

          multi_premium = method_body(
              secondary / "org/swiftapps/swiftbackup/settings/MultipleBackupStrategy$Representation.smali",
              "isPremium()Z",
          )
          assert re.search(r"(?m)^\s*const/4 p0, 0x0\s*$", multi_premium), (
              "Multi-version app backups must be treated as free"
          )

          gates = [
              (root / "org/swiftapps/swiftbackup/appslist/ui/listbatch/AppsBatchActivity.smali", "goto :cond_c"),
              (secondary / "org/swiftapps/swiftbackup/appslist/ui/listconfig/AppsConfigRunActivity.smali", "goto :cond_0"),
              (secondary / "org/swiftapps/swiftbackup/folders/ui/batch/FoldersBatchActivity.smali", "goto :cond_6"),
          ]
          for path, expected in gates:
              text = path.read_text()
              assert expected in text, f"Expected premium gate bypass in {path}"
              assert "User not premium! Finishing." in text, f"Gate audit marker missing in {path}"
          print("Validated BΛR☰ global entitlement, incremental folder backups, multi-backup strategies, and batch gates.")
          PY

      - name: Validate Firebase-to-Supabase metadata sync
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("build-src")
          backend = root / "smali_classes2/org/swiftapps/swiftbackup/backend"
          sync = (backend / "BareSupabaseProfileSync.smali").read_text()
          token_listener = (backend / "BareSupabaseProfileSync$TokenListener.smali").read_text()
          device_runner = (backend / "BareSupabaseProfileSync$ProfileUpsertRunner.smali").read_text()
          login_listener = (root / "smali/org/swiftapps/swiftbackup/backend/SupabaseLoginSuccessListener.smali").read_text()
          sign_in = (root / "smali/org/swiftapps/swiftbackup/cloud/connect/GmsSignInActivity.smali").read_text()
          app_smali = (root / "smali/org/swiftapps/swiftbackup/SwiftApp.smali").read_text()
          manifest = (root / "AndroidManifest.xml").read_text()

          assert "FirebaseAuth;->c()Lp49;" in sync, "Current Firebase user lookup is missing"
          assert "FirebaseAuth;->b(Z)Lcom/google/android/gms/tasks/Task;" in sync
          assert "BareSupabaseProfileSync$TokenListener" in sync
          assert "Ldx3;->a:Ljava/lang/String;" in token_listener, "Firebase ID-token extraction is missing"
          assert "https://fbiazqbrkwovzrirnzpb.supabase.co/rest/v1/profiles?on_conflict=user_id" in device_runner
          assert "https://fbiazqbrkwovzrirnzpb.supabase.co/rest/v1/devices?on_conflict=user_id,device_key" in device_runner
          assert "getOrCreateDeviceKey()Ljava/lang/String;" in device_runner
          assert "java/util/UUID;->randomUUID()Ljava/util/UUID;" in sync
          assert "bare_supabase_metadata" in sync and "device_key" in sync
          assert 'const-string v1, "apikey"' in device_runner
          assert 'const-string v2, "Authorization"' in device_runner
          assert "resolution=merge-duplicates,return=minimal" in device_runner
          assert "service_role" not in device_runner.lower() and "eyJhbGci" not in device_runner, (
              "A server credential or hard-coded JWT must never be embedded in the app"
          )
          assert "BareSupabaseProfileSync;->syncCurrentUser()V" in login_listener
          assert "SupabaseLoginSuccessListener" in sign_in
          assert "addOnSuccessListener(Lcom/google/android/gms/tasks/OnSuccessListener;)Lcom/google/android/gms/tasks/Task;" in sign_in
          assert "BareSupabaseProfileSync;->syncCurrentUser()V" in app_smali, (
              "Existing signed-in users are not reconciled on app startup"
          )
          assert 'android.permission.INTERNET' in manifest
          print("Validated Firebase-authenticated Supabase profile/device upserts and startup/login wiring.")
          PY

      - name: Validate HomeActivity brand span and optional Firebase RTDB
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("build-src")
          home = (root / "smali/org/swiftapps/swiftbackup/home/HomeActivity.smali").read_text()
          rtdb_factory = (root / "smali/ig3.smali").read_text()
          connection = (root / "smali_classes2/gg3.smali").read_text()
          app = (root / "smali/org/swiftapps/swiftbackup/SwiftApp.smali").read_text()
          storage = (root / "smali/qy5.smali").read_text()

          assert 'const-string p0, "/BΛR☰/"' in storage, (
              "Local backup storage directory must be isolated under /storage/emulated/0/BΛR☰/"
          )
          assert 'const-string p0, "/SwiftBackup/"' not in storage, (
              "Legacy SwiftBackup local storage path remains in the implementation"
          )
          assert 'const-string v4, "BΛR☰"' in home, "Home title must use the BΛR☰ branding"
          assert 'const/4 v4, 0x4' in home, "Home title span length must match the four-character brand"
          assert 'default-rtdb.firebaseio.com' not in rtdb_factory, (
              "Firebase Database URL must never be inferred from project ID"
          )
          assert 'Firebase Realtime Database is not configured; provide an explicit database URL.' in rtdb_factory
          assert 'if-eqz v1, :rtdb_unconfigured' in connection, (
              "Realtime Database connection observer must be optional when no URL is configured"
          )
          assert 'if-eqz v0, :goto_1' in app, (
              "App startup must skip attaching a null RTDB connection listener"
          )
          print("Validated the known-good HomeActivity brand span and optional, explicitly configured Firebase RTDB.")

          apk_saver = (root / "smali_classes2/qm.smali").read_text()
          assert 'const-string v4, "bare_backup_apks/"' in apk_saver, (
              "Saved APKs must use the BΛR☰ bare_backup_apks directory"
          )
          assert 'const-string v4, "swift_backup_apks/"' not in apk_saver, (
              "Legacy Swift Backup APK directory must not be used by BΛR☰"
          )
          storage_switch = (root / "smali/ji8.smali").read_text()
          assert '"/BΛR☰/"' in storage_switch, "Alternate internal-storage path must use BΛR☰"
          assert '"/SwiftBackup/"' not in storage_switch, "Legacy SwiftBackup root remains in active storage code"
          logger_export = (root / "smali/dt7.smali").read_text()
          logger_share = (root / "smali/er.smali").read_text()
          assert "SwiftLogger" not in logger_export and "SwiftLogger" not in logger_share, (
              "BΛR☰ logger user-facing/export strings must not retain SwiftLogger branding"
          )
          PY

      - name: Replace native library with reconstructed JNI implementation
        shell: bash
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/clang++"
          test -f tools/native-jni-replacement/native-lib.cpp
          mkdir -p build
          while IFS=: read -r abi target; do
            mkdir -p "build-src/lib/$abi"
            "$NDK_BIN/clang++" --target="$target" -fPIC -shared -std=c++17 -O2 \
              -Wall -Wextra -Werror=return-type -static-libstdc++ \
              tools/native-jni-replacement/native-lib.cpp \
              -o "build-src/lib/$abi/libnative-lib.so" \
              -landroid -ldl -llog
            "$NDK_BIN/llvm-readelf" -Ws "build-src/lib/$abi/libnative-lib.so" > "build/$abi-native-symbols.txt"
            "$NDK_BIN/llvm-readelf" -d "build-src/lib/$abi/libnative-lib.so" > "build/$abi-native-dynamic.txt"
            if grep -q 'NEEDED.*libc++_shared\.so' "build/$abi-native-dynamic.txt"; then
              echo "Unexpected libc++_shared.so dependency in reconstructed $abi library" >&2
              exit 1
            fi
            grep -q 'Java_org_swiftapps_swiftbackup_SwiftApp_getGoogleAuthAndroidClientId' "build/$abi-native-symbols.txt"
            grep -q 'Java_org_swiftapps_swiftbackup_SwiftApp_getGoogleAuthWebClientId' "build/$abi-native-symbols.txt"
            grep -q 'Java_org_swiftapps_swiftbackup_SwiftApp_isLocalNetworkTcpBlockedByPermission' "build/$abi-native-symbols.txt"
            if grep -q 'JNI_OnLoad' "build/$abi-native-symbols.txt"; then
              echo "Unexpected JNI_OnLoad found in reconstructed $abi library" >&2
              exit 1
            fi
            echo "Validated reconstructed native library for $abi ($target)"
          done <<'ABIS'
          arm64-v8a:aarch64-linux-android24
          armeabi-v7a:armv7a-linux-androideabi24
          x86:i686-linux-android24
          x86_64:x86_64-linux-android24
          ABIS
          sha256sum build-src/lib/*/libnative-lib.so
          "$NDK_BIN/clang++" --version | head -n 1
          "$NDK_BIN/llvm-readelf" --version | head -n 1

      - name: Rebuild unsigned APK
        run: |
          set -euo pipefail
          mkdir -p build
          java -jar apktool.jar b build-src --use-aapt2 --output build/barebackup-unsigned.apk
          unzip -t build/barebackup-unsigned.apk
          sha256sum build/barebackup-unsigned.apk
          ls -lh build/barebackup-unsigned.apk

      - name: Prepare stable CI signing key
        shell: bash
        env:
          BARE_DEBUG_KEYSTORE_B64: ${{ secrets.BARE_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$BARE_DEBUG_KEYSTORE_B64" || { echo "Missing BARE_DEBUG_KEYSTORE_B64 repository secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$BARE_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bare-ci.keystore"
          test -s "$RUNNER_TEMP/bare-ci.keystore"
          keytool -list -v -keystore "$RUNNER_TEMP/bare-ci.keystore" -alias androiddebugkey \
            -storepass android -keypass android | grep -E 'SHA1:|SHA-1:'

      - name: Align and sign APK with stable CI key
        shell: bash
        env:
          CI_KEYSTORE: ${{ runner.temp }}/bare-ci.keystore
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          echo "Selected Android build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/zipalign" -h 2>&1 | head -n 2 || true
          "$BUILD_TOOLS/apksigner" version
          "$BUILD_TOOLS/zipalign" -f 4 build/barebackup-unsigned.apk build/barebackup-aligned.apk
          python3 - <<'PY'
          import zipfile
          p = "build/barebackup-aligned.apk"
          with zipfile.ZipFile(p) as z:
              info = z.getinfo("resources.arsc")
              assert info.compress_type == zipfile.ZIP_STORED, f"resources.arsc is compressed: method={info.compress_type}"
              with open(p, "rb") as f:
                  f.seek(info.header_offset)
                  header = f.read(30)
                  assert header[:4] == bytes((0x50, 0x4b, 0x03, 0x04))
                  name_len = int.from_bytes(header[26:28], "little")
                  extra_len = int.from_bytes(header[28:30], "little")
                  data_offset = info.header_offset + 30 + name_len + extra_len
                  assert data_offset % 4 == 0, f"resources.arsc data offset is not 4-byte aligned: {data_offset}"
              print(f"resources.arsc is uncompressed and 4-byte aligned (offset {data_offset}).")
          PY
          "$BUILD_TOOLS/zipalign" -c -v 4 build/barebackup-aligned.apk
          sha256sum build/barebackup-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$CI_KEYSTORE" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out build/BaRe-namespace-signed.apk build/barebackup-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/BaRe-namespace-signed.apk
          sha256sum build/BaRe-namespace-signed.apk
          echo "Signing uses the stable BARE_DEBUG_KEYSTORE_B64 CI key shared with the rewrite rebuild workflow."

      - name: Package CI-labelled ZIP artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_NAME="BaRe-CI-${GITHUB_RUN_NUMBER}-run-${GITHUB_RUN_ATTEMPT}"
          mkdir -p build/package
          cp build/BaRe-namespace-signed.apk "build/package/${ARTIFACT_NAME}.apk"
          sha256sum "build/package/${ARTIFACT_NAME}.apk" > build/package/SHA256SUMS.txt
          {
            echo "Project: BΛR☰"
            echo "CI run number: ${GITHUB_RUN_NUMBER}"
            echo "CI run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "APK: ${ARTIFACT_NAME}.apk"
          } > build/package/BUILD-INFO.txt
          (cd build/package && zip -9 "../${ARTIFACT_NAME}.zip" "${ARTIFACT_NAME}.apk" SHA256SUMS.txt BUILD-INFO.txt)
          unzip -l "build/${ARTIFACT_NAME}.zip"
          sha256sum "build/${ARTIFACT_NAME}.zip"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

      - name: Upload CI-labelled ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 14
