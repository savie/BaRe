name: Build BΛR☰ Namespace APK

on:
  workflow_dispatch:
  push:
    branches:
      - Working
      - feature/namespace-barebackup
      - feat/local-account-lifecycle-vault
      - fix/supabase-appsettings-first-run-restore
      - feat/bare-own-onedrive-msal
      - fix/optional-multithreaded-feature-fallback
      - fix/supabase-user-mutation-payload-writes
      - feat/firebase-only-backend
    paths:
      - "app/google-services.json"
      - "bare-implementation/**"
      - ".github/workflows/namespace-barebackup.yml"
      - "tools/native-jni-replacement/**"
      - "tools/libsba-archive/**"
      - "tools/prepare-barebackup-build.py"
      - "tools/migrate-encrypted-constants.py"

permissions:
  contents: write

jobs:
  build-namespace-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout BΛR☰ implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Download Apktool
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o apktool.jar
          java -jar apktool.jar --version
          sha256sum apktool.jar

      - name: Generate Local Account vault Smali from audited helper source
        shell: bash
        run: |
          set -euo pipefail
          SDK_PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -f "$SDK_PLATFORM"
          test -x "$BUILD_TOOLS/d8"
          mkdir -p build/local-account-classes build/helper-apk
          javac -source 8 -target 8 -classpath "$SDK_PLATFORM" -d build/local-account-classes tools/local-account-vault-src/LocalAccountVault.java
          "$BUILD_TOOLS/d8" --min-api 23 --lib "$SDK_PLATFORM" --output build/local-account-dex $(find build/local-account-classes -name '*.class' -print)
          cat > build/helper-apk/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.bareapps.barebackup.localaccount">
            <uses-sdk android:minSdkVersion="23" />
            <application android:hasCode="true" />
          </manifest>
          EOF
          cp build/local-account-dex/classes.dex build/helper-apk/classes.dex
          (cd build/helper-apk && zip -q -r ../local-account-helper.apk AndroidManifest.xml classes.dex)
          java -jar apktool.jar d -f --no-res build/local-account-helper.apk -o build/local-account-helper-decoded
          test -d build/local-account-helper-decoded/smali/com/bareapps/barebackup/localaccount
          mkdir -p bare-implementation/smali_classes3/com/bareapps/barebackup/localaccount
          cp -a build/local-account-helper-decoded/smali/com/bareapps/barebackup/localaccount/. bare-implementation/smali_classes3/com/bareapps/barebackup/localaccount/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bare-implementation/smali_classes3/com/bareapps/barebackup/localaccount
          if ! git diff --cached --quiet; then
            git commit -m "build(local-account): generate vault helper smali [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Prepare build source and inject Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          cp -a bare-implementation build-src
          mkdir -p build
          cp app/google-services.json build/google-services.json
          sha256sum build/google-services.json
          sha256sum tools/native-jni-replacement/native-lib.cpp
          python3 tools/prepare-barebackup-build.py
          python3 -m pip install --break-system-packages cryptography
          python3 tools/migrate-encrypted-constants.py build-src

      - name: Replace native library with reconstructed JNI implementation
        shell: bash
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$NDK_BIN/clang++"
          test -f tools/native-jni-replacement/native-lib.cpp
          mkdir -p build
          while IFS=: read -r abi target; do
            mkdir -p "build-src/lib/$abi"
            "$NDK_BIN/clang++" --target="$target" -fPIC -shared -std=c++17 -O2 \
              -Wall -Wextra -Werror=return-type -static-libstdc++ \
              tools/native-jni-replacement/native-lib.cpp \
              -o "build-src/lib/$abi/libnative-lib.so" \
              -landroid -ldl -llog
            "$NDK_BIN/llvm-readelf" -Ws "build-src/lib/$abi/libnative-lib.so" > "build/$abi-native-symbols.txt"
            "$NDK_BIN/llvm-readelf" -d "build-src/lib/$abi/libnative-lib.so" > "build/$abi-native-dynamic.txt"
            if grep -q 'NEEDED.*libc++_shared\.so' "build/$abi-native-dynamic.txt"; then
              echo "Unexpected libc++_shared.so dependency in reconstructed $abi library" >&2
              exit 1
            fi
            grep -q 'Java_com_bareapps_barebackup_BareApp_getGoogleAuthAndroidClientId' "build/$abi-native-symbols.txt"
            grep -q 'Java_com_bareapps_barebackup_BareApp_getGoogleAuthWebClientId' "build/$abi-native-symbols.txt"
            grep -q 'Java_com_bareapps_barebackup_BareApp_isLocalNetworkTcpBlockedByPermission' "build/$abi-native-symbols.txt"
            if grep -q 'JNI_OnLoad' "build/$abi-native-symbols.txt"; then
              echo "Unexpected JNI_OnLoad found in reconstructed $abi library" >&2
              exit 1
            fi
            echo "Validated reconstructed native library for $abi ($target)"
          done <<'ABIS'
          arm64-v8a:aarch64-linux-android24
          armeabi-v7a:armv7a-linux-androideabi24
          x86:i686-linux-android24
          x86_64:x86_64-linux-android24
          ABIS
          sha256sum build-src/lib/*/libnative-lib.so
          "$NDK_BIN/clang++" --version | head -n 1
          "$NDK_BIN/llvm-readelf" --version | head -n 1

      - name: Test and build BaRe archive native library
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build-src/smali/com/bareapps/sba")
          contracts = {
              "SbaArchiveNative.smali": {"createArchive"},
              "SbaBareTarNative.smali": {
                  "createTarToFdWithWriteStatsRaw",
                  "extractTarFromFdRaw",
                  "extractTarFromFdWithStatsRaw",
                  "extractTarZstdFromFdRaw",
                  "listTarEntriesFromFdRaw",
                  "listTarEntriesZstdFromFdRaw",
                  "extractAegisArchiveEntry",
                  "extractAegisArchiveEntryFused",
              },
              "SbaLibaegisCryptoNative.smali": {
                  "decryptAegis128X2ChunkedEntryFdRaw",
                  "decryptAegis256ChunkedEntryFdRaw",
                  "encryptAegis256ChunkedEntryFdRaw",
                  "isAvailable",
              },
              "SbaNativeCrypto.smali": {"deriveArgon2id"},
              "SbaRuntimeNative.smali": {"version"},
              "SbaZstdNative.smali": {
                  "compressZstdBytes",
                  "decompressZstdBytes",
                  "decompressZstdFdToFdRaw",
                  "compressZstdFdToFdRaw",
                  "compressZstdFileToFdRaw",
              },
          }
          total = 0
          for filename, expected in contracts.items():
              source = (root / filename).read_text()
              actual = set(re.findall(r"(?m)^\.method[^\n]*\bnative\s+([A-Za-z0-9_$]+)\(", source))
              if actual != expected:
                  raise SystemExit(
                      f"{filename}: native declaration mismatch; "
                      f"missing={sorted(expected - actual)}, extra={sorted(actual - expected)}"
                  )
              total += len(actual)
          if total != 20:
              raise SystemExit(f"Expected exactly 20 callable JNI declarations, found {total}")

          legacy = []
          for path in Path("build-src").rglob("*"):
              if path.is_file() and path.suffix.lower() in {
                  ".smali", ".xml", ".json", ".txt", ".properties", ".java", ".kt"
              }:
                  try:
                      if re.search(r"(?i)swift", path.read_text(errors="ignore")):
                          legacy.append(str(path))
                  except OSError:
                      pass
          if legacy:
              raise SystemExit("Legacy Swift text remains in APK source: " + ", ".join(legacy[:20]))
          print("Validated exactly 20 BaRe JNI declarations and no legacy Swift text in APK source.")
          PY
          cmake -S tools/libsba-archive -B build/libsba-tests -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/libsba-tests --parallel 2
          ctest --test-dir build/libsba-tests --output-on-failure

          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            cmake -S tools/libsba-archive -B "build/libsba-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-24 \
              -DCMAKE_BUILD_TYPE=Release -DANDROID_STL=c++_static -DBUILD_TESTING=OFF
            cmake --build "build/libsba-$abi" --target sba_archive --parallel 2
            mkdir -p "build-src/lib/$abi"
            cp "build/libsba-$abi/libsba_archive.so" "build-src/lib/$abi/libsba_archive.so"
            "$NDK_BIN/llvm-readelf" -Ws "build-src/lib/$abi/libsba_archive.so" > "build/$abi-libsba-symbols.txt"
            "$NDK_BIN/llvm-readelf" -d "build-src/lib/$abi/libsba_archive.so" > "build/$abi-libsba-dynamic.txt"
            for symbol in \
              Java_com_bareapps_sba_SbaZstdNative_compressZstdBytes \
              Java_com_bareapps_sba_SbaZstdNative_decompressZstdBytes \
              Java_com_bareapps_sba_SbaZstdNative_decompressZstdFdToFdRaw \
              Java_com_bareapps_sba_SbaZstdNative_compressZstdFdToFdRaw \
              Java_com_bareapps_sba_SbaZstdNative_compressZstdFileToFdRaw \
              Java_com_bareapps_sba_SbaBareTarNative_listTarEntriesFromFdRaw \
              Java_com_bareapps_sba_SbaBareTarNative_listTarEntriesZstdFromFdRaw \
              Java_com_bareapps_sba_SbaBareTarNative_createTarToFdWithWriteStatsRaw \
              Java_com_bareapps_sba_SbaBareTarNative_extractTarFromFdRaw \
              Java_com_bareapps_sba_SbaBareTarNative_extractTarFromFdWithStatsRaw \
              Java_com_bareapps_sba_SbaBareTarNative_extractTarZstdFromFdRaw \
              Java_com_bareapps_sba_SbaBareTarNative_extractAegisArchiveEntry \
              Java_com_bareapps_sba_SbaBareTarNative_extractAegisArchiveEntryFused \
              Java_com_bareapps_sba_SbaNativeCrypto_deriveArgon2id \
              Java_com_bareapps_sba_SbaLibaegisCryptoNative_isAvailable \
              Java_com_bareapps_sba_SbaArchiveNative_createArchive \
              Java_com_bareapps_sba_SbaLibaegisCryptoNative_decryptAegis128X2ChunkedEntryFdRaw \
              Java_com_bareapps_sba_SbaLibaegisCryptoNative_decryptAegis256ChunkedEntryFdRaw \
              Java_com_bareapps_sba_SbaLibaegisCryptoNative_encryptAegis256ChunkedEntryFdRaw \
              Java_com_bareapps_sba_SbaRuntimeNative_version ; do
              grep -q "[[:space:]]$symbol$" "build/$abi-libsba-symbols.txt" || {
                echo "Missing required SBA JNI export for $abi: $symbol" >&2
                exit 1
              }
            done
            actual_exports="$(grep -Eo 'Java_[A-Za-z0-9_]+' "build/$abi-libsba-symbols.txt" | sort -u | wc -l)"
            if [ "$actual_exports" -ne 20 ]; then
              echo "Expected exactly 20 exported JNI functions for $abi, found $actual_exports" >&2
              exit 1
            fi
            if grep -Eqi 'Java_com_swiftapps_|com\.swiftapps\.sba|Swift' "build/$abi-libsba-symbols.txt" "build/$abi-libsba-dynamic.txt" ||
               strings "build-src/lib/$abi/libsba_archive.so" | grep -Eqi 'Java_com_swiftapps_|com\.swiftapps\.sba|Swift'; then
              echo "Legacy Java package namespace found in libsba_archive.so for $abi" >&2
              exit 1
            fi
            if grep -q 'NEEDED.*libc++_shared\.so' "build/$abi-libsba-dynamic.txt"; then
              echo "Unexpected libc++_shared.so dependency in libsba_archive.so for $abi" >&2
              exit 1
            fi
            echo "Validated libsba_archive.so for $abi"
          done
          sha256sum build-src/lib/*/libsba_archive.so

      - name: Rebuild unsigned APK
        run: |
          set -euo pipefail
          mkdir -p build
          java -jar apktool.jar b build-src --use-aapt2 --output build/barebackup-unsigned.apk
          unzip -t build/barebackup-unsigned.apk
          sha256sum build/barebackup-unsigned.apk
          ls -lh build/barebackup-unsigned.apk

      - name: Prepare stable CI signing key
        shell: bash
        env:
          BARE_DEBUG_KEYSTORE_B64: ${{ secrets.BARE_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$BARE_DEBUG_KEYSTORE_B64" || { echo "Missing BARE_DEBUG_KEYSTORE_B64 repository secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$BARE_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bare-ci.keystore"
          test -s "$RUNNER_TEMP/bare-ci.keystore"
          keytool -list -v -keystore "$RUNNER_TEMP/bare-ci.keystore" -alias androiddebugkey \
            -storepass android -keypass android | grep -E 'SHA1:|SHA-1:'

      - name: Align and sign APK with stable CI key
        shell: bash
        env:
          CI_KEYSTORE: ${{ runner.temp }}/bare-ci.keystore
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          echo "Selected Android build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/zipalign" -h 2>&1 | head -n 2 || true
          "$BUILD_TOOLS/apksigner" version
          "$BUILD_TOOLS/zipalign" -f 4 build/barebackup-unsigned.apk build/barebackup-aligned.apk
          python3 - <<'PY'
          import zipfile
          p = "build/barebackup-aligned.apk"
          with zipfile.ZipFile(p) as z:
              info = z.getinfo("resources.arsc")
              assert info.compress_type == zipfile.ZIP_STORED, f"resources.arsc is compressed: method={info.compress_type}"
              with open(p, "rb") as f:
                  f.seek(info.header_offset)
                  header = f.read(30)
                  assert header[:4] == bytes((0x50, 0x4b, 0x03, 0x04))
                  name_len = int.from_bytes(header[26:28], "little")
                  extra_len = int.from_bytes(header[28:30], "little")
                  data_offset = info.header_offset + 30 + name_len + extra_len
                  assert data_offset % 4 == 0, f"resources.arsc data offset is not 4-byte aligned: {data_offset}"
              print(f"resources.arsc is uncompressed and 4-byte aligned (offset {data_offset}).")
          PY
          "$BUILD_TOOLS/zipalign" -c -v 4 build/barebackup-aligned.apk
          sha256sum build/barebackup-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$CI_KEYSTORE" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out build/BaRe-namespace-signed.apk build/barebackup-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/BaRe-namespace-signed.apk
          sha256sum build/BaRe-namespace-signed.apk
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import subprocess
          import zipfile

          apk = Path("build/BaRe-namespace-signed.apk")
          abis = ("arm64-v8a", "armeabi-v7a", "x86", "x86_64")
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              for abi in abis:
                  entry = f"lib/{abi}/libsba_archive.so"
                  if entry not in names:
                      raise SystemExit(f"Missing {entry} from final APK")
                  packaged = archive.read(entry)
                  built = Path(f"build/libsba-{abi}/libsba_archive.so").read_bytes()
                  if hashlib.sha256(packaged).digest() != hashlib.sha256(built).digest():
                      raise SystemExit(f"Packaged {entry} differs from the ABI build output")
                  output = subprocess.run(
                      ["strings"], input=packaged, check=True, capture_output=True
                  ).stdout
                  if re.search(rb"(?i)swift", output):
                      raise SystemExit(f"Legacy Swift string found in {entry}")
              for entry in names:
                  if re.search(r"(?i)swift", entry):
                      raise SystemExit(f"Legacy Swift name found in APK entry: {entry}")
                  if entry.endswith(".dex") and re.search(rb"(?i)swift", archive.read(entry)):
                      raise SystemExit(f"Legacy Swift string found in APK DEX: {entry}")
                  if entry.endswith(".so"):
                      output = subprocess.run(
                          ["strings"], input=archive.read(entry), check=True, capture_output=True
                      ).stdout
                      if re.search(rb"(?i)swift", output):
                          raise SystemExit(f"Legacy Swift string found in APK native library: {entry}")
          print("Verified all four libsba_archive.so binaries are packaged byte-for-byte in the signed APK; no Swift text in DEX/native archive.")
          PY
          echo "Signing uses the stable BARE_DEBUG_KEYSTORE_B64 CI key shared with the rewrite rebuild workflow."

      - name: Package CI-labelled ZIP artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_NAME="BaRe-CI-${GITHUB_RUN_NUMBER}-run-${GITHUB_RUN_ATTEMPT}"
          mkdir -p build/package
          cp build/BaRe-namespace-signed.apk "build/package/${ARTIFACT_NAME}.apk"
          sha256sum "build/package/${ARTIFACT_NAME}.apk" > build/package/SHA256SUMS.txt
          {
            echo "Project: BΛR☰"
            echo "CI run number: ${GITHUB_RUN_NUMBER}"
            echo "CI run attempt: ${GITHUB_RUN_ATTEMPT}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "APK: ${ARTIFACT_NAME}.apk"
          } > build/package/BUILD-INFO.txt
          (cd build/package && zip -9 "../${ARTIFACT_NAME}.zip" "${ARTIFACT_NAME}.apk" SHA256SUMS.txt BUILD-INFO.txt)
          unzip -l "build/${ARTIFACT_NAME}.zip"
          sha256sum "build/${ARTIFACT_NAME}.zip"
          echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

      - name: Upload CI-labelled ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 14
