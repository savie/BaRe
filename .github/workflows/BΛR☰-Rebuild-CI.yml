name: BΛR☰ App-only CI

run-name: "BΛR☰ App-only CI #${{ github.run_number }} - ${{ github.ref_name }}"

on:
  # Run automatically only when app code or build configuration changes on this work branch.
  push:
    branches:
      - feature/apps-list-ui
    paths:
      - "app/**"
      - "build.gradle"
      - "build.gradle.kts"
      - "settings.gradle"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/BΛR☰-Rebuild-CI.yml"
  # Keep manual runs available for targeted verification.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-build:
    name: App unit tests and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://fbiazqbrkwovzrirnzpb.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_qTDGXWoCW79yAL0jyO27mw_MPJY_Ryi' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.1"

      - name: Run app unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK artifact
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: BaRe-app-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
