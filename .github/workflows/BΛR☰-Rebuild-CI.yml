name: BΛR☰ Rebuild CI

run-name: "BΛR☰ Rebuild CI #${{ github.run_number }} - ${{ github.ref_name }}"

on:
  push:
    branches: [rewrite]
  pull_request:
    branches: [rewrite]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK identity
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.bareapps.barebackup'"
          if "$AAPT" dump resources "$APK" | grep -E 'swift-backup-31751|msal_default_config|odrive_browser|odrive_webview'; then
            echo "Reference backend/provider resources must not be packaged."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bare-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
