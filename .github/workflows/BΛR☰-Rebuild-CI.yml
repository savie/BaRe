name: BΛR☰ Rebuild CI

run-name: "BΛR☰ Rebuild CI #${{ github.run_number }} - ${{ github.ref_name }}"

on:
  # Manual runs are always available from the Actions tab.
  workflow_dispatch:

  # Automatic runs are allowed only when files under app/ change.
  #push:
  #  paths:
  #    - "app/**"
  #pull_request:
  #  paths:
  #    - "app/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.1"

      - name: Prepare stable CI signing key
        env:
          BARE_DEBUG_KEYSTORE_B64: ${{ secrets.BARE_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$BARE_DEBUG_KEYSTORE_B64"
          printf '%s' "$BARE_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bare-ci.keystore"
          test -s "$RUNNER_TEMP/bare-ci.keystore"

      - name: Print CI signing certificate SHA-1
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/bare-ci.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android |
            grep -E 'SHA1:|SHA-1:'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Sign debug APK with CI keystore
        env:
          CI_KEYSTORE: ${{ runner.temp }}/bare-ci.keystore
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$CI_KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$APK_PATH"
          "$APKSIGNER" verify "$APK_PATH"

      - name: Verify APK artifact
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK with CI number
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/BaRe-rebuild-debug-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: BaRe-rebuild-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/BaRe-rebuild-debug-${{ github.run_number }}.apk
          if-no-files-found: error
