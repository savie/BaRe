name: BΛR☰ Android CI

on:
  push:
    branches:
      - phase-1-7-audit
      - rewrite
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify application identity and resource isolation
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          AAPT="$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "package: name='com.bare.backup'"
          if "$AAPT" dump resources app/build/outputs/apk/debug/app-debug.apk | grep -E 'msal_default_config|odrive_browser|odrive_webview'; then
            echo "Legacy/reference provider resources must not be packaged in BΛR☰."
            exit 1
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bare-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
