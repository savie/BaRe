name: BaRe CI

run-name: "BaRe CI #${{ github.run_number }} - ${{ github.ref_name }}"

on:
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

env:
  BARE_APK_PATH: "app/build/outputs/apk/debug/app-debug.apk"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Prepare stable CI signing key
        env:
          BARE_DEBUG_KEYSTORE_B64: ${{ secrets.BARE_DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$BARE_DEBUG_KEYSTORE_B64"
          printf '%s' "$BARE_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bare-ci.keystore"
          test -s "$RUNNER_TEMP/bare-ci.keystore"

      - name: Assemble signed debug APK
        env:
          BARE_SIGNING_KEYSTORE: ${{ runner.temp }}/bare-ci.keystore
        run: |
          gradle :app:assembleDebug --no-daemon

      - name: Verify APK artifact
        run: |
          test -f "$BARE_APK_PATH"
          ls -lh "$BARE_APK_PATH"

      - name: Rename APK with CI number
        run: |
          cp "$BARE_APK_PATH" "app/build/outputs/apk/debug/BaRe-debug-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BaRe-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/BaRe-debug-${{ github.run_number }}.apk
          if-no-files-found: error
