name: BaRe Android Build

on:
  push:
    branches:
      - "v1.0/rebaseline"
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    branches:
      - "v1.0/rebaseline"
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      install_apk:
        description: "Pasang APK ke device/emulator yang sudah terhubung"
        required: false
        default: false
        type: boolean

env:
  BARE_APPLICATION_ID: "com.bare"
  BARE_VERSION_NAME: "1.0"
  BARE_APK_PATH: "app/build/outputs/apk/debug/app-debug.apk"
  BARE_APK_UPDATE_MODE: "IN_PLACE"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BARE_VERSION_CODE: ${{ github.run_number }}
      BARE_EXPECTED_DEBUG_CERT_SHA256: 1BAF08DCAC7AEE98E4769795A71E3F74070FDB56B03A44C3119D273A66722391

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11"

      - name: Prepare and verify stable debug signing key
        id: prepare_stable_key
        env:
          BARE_DEBUG_KEYSTORE_B64: ${{ secrets.BARE_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$BARE_DEBUG_KEYSTORE_B64" ]; then
            echo "BARE_DEBUG_KEYSTORE_B64 is required for the CI APK channel."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          clean_b64="$(printf '%s' "$BARE_DEBUG_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/')"
          remainder=$(( ${#clean_b64} % 4 ))
          if [ "$remainder" -eq 1 ]; then
            echo "BARE_DEBUG_KEYSTORE_B64 has an invalid Base64 length."
            exit 1
          fi
          while [ "$remainder" -ne 0 ]; do
            clean_b64="${clean_b64}="
            remainder=$(( ${#clean_b64} % 4 ))
          done
          printf '%s' "$clean_b64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          actual_cert_sha256="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual_cert_sha256" != "$BARE_EXPECTED_DEBUG_CERT_SHA256" ]; then
            echo "Stable debug keystore certificate fingerprint mismatch."
            echo "Expected: $BARE_EXPECTED_DEBUG_CERT_SHA256"
            echo "Actual:   $actual_cert_sha256"
            exit 1
          fi

          echo "BARE_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "BARE_DEBUG_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "BARE_DEBUG_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "BARE_DEBUG_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK artifact
        run: |
          test -f "$BARE_APK_PATH"
          ls -lh "$BARE_APK_PATH"

      - name: Verify APK signing certificate
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "Android build-tools apksigner not found."
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs "$BARE_APK_PATH"
          actual_apk_cert_sha256="$("$apksigner_path" verify --print-certs "$BARE_APK_PATH" | awk '/V2 Signer: certificate SHA-256 digest:/{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual_apk_cert_sha256" != "$BARE_EXPECTED_DEBUG_CERT_SHA256" ]; then
            echo "Built APK certificate fingerprint mismatch."
            echo "Expected: $BARE_EXPECTED_DEBUG_CERT_SHA256"
            echo "Actual:   $actual_apk_cert_sha256"
            exit 1
          fi

      - name: Label APK with build identity
        run: |
          versioned_apk="app/build/outputs/apk/debug/BaRe-v${BARE_VERSION_NAME}-build-${BARE_VERSION_CODE}.apk"
          cp "$BARE_APK_PATH" "$versioned_apk"
          echo "BARE_VERSIONED_APK_PATH=$versioned_apk" >> "$GITHUB_ENV"
          echo "BaRe v${BARE_VERSION_NAME} build #${BARE_VERSION_CODE}"
          ls -lh "$versioned_apk"

      - name: Optional in-place APK update
        id: update_apk
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_apk == true }}
        continue-on-error: true
        env:
          BARE_APK_UPDATE_MODE: "IN_PLACE"
        run: |
          if [ "$BARE_APK_UPDATE_MODE" != "IN_PLACE" ]; then
            echo "Refusing APK update: update mode must remain IN_PLACE."
            exit 1
          fi
          adb devices
          adb install -r "$BARE_APK_PATH"

      - name: Verify in-place APK update result
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.install_apk == true }}
        env:
          INITIAL_UPDATE_OUTCOME: ${{ steps.update_apk.outcome }}
        run: |
          if [ "$INITIAL_UPDATE_OUTCOME" = "success" ]; then
            echo "In-place APK update succeeded."
            exit 0
          fi
          echo "In-place APK update was not verified as successful."
          echo "Update outcome: $INITIAL_UPDATE_OUTCOME"
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BaRe-v${{ env.BARE_VERSION_NAME }}-build-${{ env.BARE_VERSION_CODE }}
          path: ${{ env.BARE_VERSIONED_APK_PATH }}
          if-no-files-found: error
