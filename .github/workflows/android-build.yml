name: BaRe Android Build

on:
  push:
    branches:
      - "v1.0/rebaseline"
  pull_request:
    branches:
      - "v1.0/rebaseline"
  workflow_dispatch:
    inputs:
      install_apk:
        description: "Pasang APK ke device/emulator yang sudah terhubung"
        required: false
        default: false
        type: boolean

env:
  BARE_APPLICATION_ID: "com.savie.bare"
  BARE_VERSION_NAME: "1.0"
  BARE_APK_PATH: "app/build/outputs/apk/debug/app-debug.apk"
  BARE_APK_UPDATE_MODE: "IN_PLACE"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BARE_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK artifact
        run: |
          test -f "$BARE_APK_PATH"
          ls -lh "$BARE_APK_PATH"

      - name: Label APK with build identity
        run: |
          versioned_apk="app/build/outputs/apk/debug/BaRe-v${BARE_VERSION_NAME}-build-${BARE_VERSION_CODE}.apk"
          cp "$BARE_APK_PATH" "$versioned_apk"
          echo "BARE_VERSIONED_APK_PATH=$versioned_apk" >> "$GITHUB_ENV"
          echo "BaRe v${BARE_VERSION_NAME} build #${BARE_VERSION_CODE}"
          ls -lh "$versioned_apk"

      - name: Optional in-place APK update
        id: update_apk
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_apk == true }}
        continue-on-error: true
        env:
          BARE_APK_UPDATE_MODE: "IN_PLACE"
        run: |
          if [ "$BARE_APK_UPDATE_MODE" != "IN_PLACE" ]; then
            echo "Refusing APK update: update mode must remain IN_PLACE."
            exit 1
          fi
          adb devices
          adb install -r "$BARE_APK_PATH"

      - name: Prepare stable debug signing key fallback
        id: prepare_stable_key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_apk == true && steps.update_apk.outcome == 'failure' }}
        env:
          BARE_DEBUG_KEYSTORE_B64: ${{ secrets.BARE_DEBUG_KEYSTORE_B64 }}
          BARE_EXPECTED_DEBUG_CERT_SHA256: ${{ vars.BARE_EXPECTED_DEBUG_CERT_SHA256 }}
        run: |
          if [ -z "$BARE_DEBUG_KEYSTORE_B64" ]; then
            echo "Stable debug keystore secret is not configured; fallback cannot be attempted."
            exit 1
          fi
          if [ -z "$BARE_EXPECTED_DEBUG_CERT_SHA256" ]; then
            echo "BARE_EXPECTED_DEBUG_CERT_SHA256 repository variable is required for stable signing fallback."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          clean_b64="$(printf '%s' "$BARE_DEBUG_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/')"
          remainder=$(( ${#clean_b64} % 4 ))
          if [ "$remainder" -eq 1 ]; then
            echo "BARE_DEBUG_KEYSTORE_B64 has an invalid Base64 length."
            exit 1
          fi
          while [ "$remainder" -ne 0 ]; do
            clean_b64="${clean_b64}="
            remainder=$(( ${#clean_b64} % 4 ))
          done
          printf '%s' "$clean_b64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          actual_cert_sha256="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected_cert_sha256="$(printf '%s' "$BARE_EXPECTED_DEBUG_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual_cert_sha256" != "$expected_cert_sha256" ]; then
            echo "Stable debug keystore certificate fingerprint mismatch."
            echo "Expected: $expected_cert_sha256"
            echo "Actual:   $actual_cert_sha256"
            exit 1
          fi

          echo "BARE_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "BARE_DEBUG_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "BARE_DEBUG_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "BARE_DEBUG_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Rebuild debug APK with stable signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_apk == true && steps.update_apk.outcome == 'failure' && steps.prepare_stable_key.outcome == 'success' }}
        run: |
          rm -f "$BARE_APK_PATH"
          gradle :app:assembleDebug --no-daemon
          test -f "$BARE_APK_PATH"
          versioned_apk="app/build/outputs/apk/debug/BaRe-v${BARE_VERSION_NAME}-build-${BARE_VERSION_CODE}.apk"
          cp "$BARE_APK_PATH" "$versioned_apk"
          echo "BARE_VERSIONED_APK_PATH=$versioned_apk" >> "$GITHUB_ENV"

      - name: Retry in-place APK update with stable signing
        id: retry_update_apk
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.install_apk == true && steps.update_apk.outcome == 'failure' && steps.prepare_stable_key.outcome == 'success' }}
        run: |
          if [ "$BARE_APK_UPDATE_MODE" != "IN_PLACE" ]; then
            echo "Refusing APK update: update mode must remain IN_PLACE."
            exit 1
          fi
          adb install -r "$BARE_APK_PATH"

      - name: Verify in-place APK update result
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.install_apk == true }}
        env:
          INITIAL_UPDATE_OUTCOME: ${{ steps.update_apk.outcome }}
          FALLBACK_PREPARE_OUTCOME: ${{ steps.prepare_stable_key.outcome }}
          FALLBACK_UPDATE_OUTCOME: ${{ steps.retry_update_apk.outcome }}
        run: |
          if [ "$INITIAL_UPDATE_OUTCOME" = "success" ]; then
            echo "In-place APK update succeeded without fallback."
            exit 0
          fi
          if [ "$FALLBACK_PREPARE_OUTCOME" = "success" ] && [ "$FALLBACK_UPDATE_OUTCOME" = "success" ]; then
            echo "In-place APK update succeeded after stable-signing fallback."
            exit 0
          fi
          echo "In-place APK update was not verified as successful."
          echo "Initial update: $INITIAL_UPDATE_OUTCOME"
          echo "Stable-key preparation: $FALLBACK_PREPARE_OUTCOME"
          echo "Fallback update: $FALLBACK_UPDATE_OUTCOME"
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BaRe-v${{ env.BARE_VERSION_NAME }}-build-${{ env.BARE_VERSION_CODE }}
          path: ${{ env.BARE_VERSIONED_APK_PATH }}
          if-no-files-found: error
