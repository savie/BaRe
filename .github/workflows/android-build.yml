name: Android Build

on:
  push:
    branches:
      - master
      - 'bootstrap/**'
    paths:
      - 'app/**'
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    branches:
      - master
    paths:
      - 'app/**'
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BARE_VERSION_CODE: ${{ github.run_number }}
      BARE_VERSION_NAME: 0.1.${{ github.run_number }}
      BARE_EXPECTED_DEBUG_CERT_SHA256: 1BAF08DCAC7AEE98E4769795A71E3F74070FDB56B03A44C3119D273A66722391

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare and verify stable debug signing key
        env:
          BARE_DEBUG_KEYSTORE_B64: ${{ secrets.BARE_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$BARE_DEBUG_KEYSTORE_B64" ]; then
            echo "BARE_DEBUG_KEYSTORE_B64 is required for the update-safe CI APK channel."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          clean_b64="$(printf '%s' "$BARE_DEBUG_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/')"
          remainder=$(( ${#clean_b64} % 4 ))
          if [ "$remainder" -eq 1 ]; then
            echo "BARE_DEBUG_KEYSTORE_B64 has an invalid Base64 length."
            exit 1
          fi
          while [ "$remainder" -ne 0 ]; do
            clean_b64="${clean_b64}="
            remainder=$(( ${#clean_b64} % 4 ))
          done
          printf '%s' "$clean_b64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          actual_cert_sha256="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual_cert_sha256" != "$BARE_EXPECTED_DEBUG_CERT_SHA256" ]; then
            echo "Stable debug keystore certificate fingerprint mismatch."
            echo "Expected: $BARE_EXPECTED_DEBUG_CERT_SHA256"
            echo "Actual:   $actual_cert_sha256"
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signing certificate
        run: |
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$apksigner_path" ]; then
            echo "Android build-tools apksigner not found."
            exit 1
          fi
          apk_path="app/build/outputs/apk/debug/app-debug.apk"
          "$apksigner_path" verify --verbose --print-certs "$apk_path"
          actual_apk_cert_sha256="$("$apksigner_path" verify --print-certs "$apk_path" | awk '/V2 Signer: certificate SHA-256 digest:/{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual_apk_cert_sha256" != "$BARE_EXPECTED_DEBUG_CERT_SHA256" ]; then
            echo "Built APK certificate fingerprint mismatch."
            echo "Expected: $BARE_EXPECTED_DEBUG_CERT_SHA256"
            echo "Actual:   $actual_apk_cert_sha256"
            exit 1
          fi

      - name: Run JVM unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bare-debug-apk-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
