name: Android Build

on:
  push:
    branches:
      - master
      - 'bootstrap/**'
    paths:
      - 'app/**'
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    branches:
      - master
    paths:
      - 'app/**'
      - 'core/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BARE_VERSION_CODE: ${{ github.run_number }}
      BARE_VERSION_NAME: 0.1.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare stable debug signing key
        env:
          BARE_DEBUG_KEYSTORE_B64: ${{ secrets.BARE_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$BARE_DEBUG_KEYSTORE_B64" ]; then
            echo "No stable debug keystore configured; using runner default debug signing."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          clean_b64="$(printf '%s' "$BARE_DEBUG_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/')"
          remainder=$(( ${#clean_b64} % 4 ))
          if [ "$remainder" -eq 1 ]; then
            echo "BARE_DEBUG_KEYSTORE_B64 has an invalid Base64 length."
            exit 1
          fi
          while [ "$remainder" -ne 0 ]; do
            clean_b64="${clean_b64}="
            remainder=$(( ${#clean_b64} % 4 ))
          done
          printf '%s' "$clean_b64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bare-debug-apk-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
