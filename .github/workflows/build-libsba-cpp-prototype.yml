name: Build libsba archive C++ prototype

on:
  workflow_dispatch:
  push:
    branches:
      - feat/libsba-archive-cpp
    paths:
      - "tools/libsba-archive-cpp/**"
      - ".github/workflows/build-libsba-cpp-prototype.yml"

permissions:
  contents: read

jobs:
  test-argon2-kat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4
      - name: Build and run Argon2id known-answer test
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 20190702 https://github.com/P-H-C/phc-winner-argon2.git /tmp/phc-winner-argon2
          cc -std=c99 -O2 -DARGON2_NO_THREADS \
            -I/tmp/phc-winner-argon2/include -I/tmp/phc-winner-argon2/src \
            /tmp/phc-winner-argon2/src/argon2.c \
            /tmp/phc-winner-argon2/src/core.c \
            /tmp/phc-winner-argon2/src/encoding.c \
            /tmp/phc-winner-argon2/src/ref.c \
            /tmp/phc-winner-argon2/src/blake2/blake2b.c \
            tools/libsba-archive-cpp/tests/argon2id_kat.c \
            -o /tmp/argon2id_kat
          /tmp/argon2id_kat

  build-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Configure and build prototype
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          export ANDROID_NDK_VERSION="27.2.12479018"
          tools/libsba-archive-cpp/build-prototype.sh "$ABI" "artifacts/$ABI"
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
                    ORIGINAL="$GITHUB_WORKSPACE/reference/apktool/lib/$ABI/libsba_archive.so"
          test -f "$ORIGINAL"
          "$NDK_BIN/llvm-readelf" -Ws "$ORIGINAL" > "artifacts/$ABI/original-symbols-all.txt"
          # JNI may be registered dynamically rather than exported as Java_* symbols.
          # An empty named-export list is inconclusive, not a workflow failure.
          grep -oE 'Java_com_swiftapps_sba_[A-Za-z0-9_\\$]+' "artifacts/$ABI/original-symbols-all.txt" | sort -u > "artifacts/$ABI/original-jni-symbols.txt" || true
          grep -oE 'Java_com_swiftapps_sba_[A-Za-z0-9_\\$]+' "artifacts/$ABI/jni-symbols.txt" | sort -u > "artifacts/$ABI/prototype-jni-symbols.txt" || true
          if test -s "artifacts/$ABI/original-jni-symbols.txt"; then
            comm -23 "artifacts/$ABI/original-jni-symbols.txt" "artifacts/$ABI/prototype-jni-symbols.txt" > "artifacts/$ABI/missing-original-jni-symbols.txt"
            echo "Original binary has named JNI exports; missing exports are listed for compatibility tracking."
          else
            : > "artifacts/$ABI/missing-original-jni-symbols.txt"
            echo "Original binary has no matching named JNI exports; inspect JNI_OnLoad/RegisterNatives and Java declarations separately."
          fi
          strings -a "$ORIGINAL" | grep -Ei 'version|SwiftTar|aegis|zstd|argon2|tar' > "artifacts/$ABI/original-relevant-strings.txt" || true
          printf 'Original JNI exports: '; wc -l < "artifacts/$ABI/original-jni-symbols.txt"
          printf 'Prototype JNI exports: '; wc -l < "artifacts/$ABI/prototype-jni-symbols.txt"
          printf 'Original JNI exports not yet implemented:\n'
          cat "artifacts/$ABI/missing-original-jni-symbols.txt"
          printf 'Relevant original binary strings:\n'
          cat "artifacts/$ABI/original-relevant-strings.txt"

      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: libsba-cpp-prototype-${{ matrix.abi }}
          path: artifacts/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 14
