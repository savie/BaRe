name: Build libsba archive C++ prototype

on:
  workflow_dispatch:
  push:
    branches:
      - feat/libsba-archive-cpp
    paths:
      - "native/libsba-archive-cpp/**"
      - ".github/workflows/build-libsba-cpp-prototype.yml"

permissions:
  contents: read

jobs:
  build-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - name: Checkout prototype
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Configure and build prototype
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cmake --version
          cmake -S native/libsba-archive-cpp -B "build/libsba-cpp/$ABI" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "build/libsba-cpp/$ABI" --parallel 2
          mkdir -p "artifacts/$ABI"
          cp "build/libsba-cpp/$ABI/libsba_archive_cpp.so" "artifacts/$ABI/"
          "$NDK_BIN/llvm-readelf" -h "artifacts/$ABI/libsba_archive_cpp.so"
          "$NDK_BIN/llvm-readelf" -Ws "artifacts/$ABI/libsba_archive_cpp.so" > "artifacts/$ABI/jni-symbols.txt"
          grep -q 'Java_com_swiftapps_sba_SbaZstdNative_compressZstdBytes' "artifacts/$ABI/jni-symbols.txt"
          grep -q 'Java_com_swiftapps_sba_SbaZstdNative_decompressZstdBytes' "artifacts/$ABI/jni-symbols.txt"
          grep -q 'Java_com_swiftapps_sba_SbaZstdNative_decompressZstdFdToFdRaw' "artifacts/$ABI/jni-symbols.txt"
          printf 'ABI=%s\nGIT_SHA=%s\n' "$ABI" "$GITHUB_SHA" > "artifacts/$ABI/BUILD-METADATA.txt"
          sha256sum "artifacts/$ABI/libsba_archive_cpp.so" | tee "artifacts/$ABI/SHA256SUMS.txt"

      - name: Upload prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: libsba-cpp-prototype-${{ matrix.abi }}
          path: artifacts/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 14
