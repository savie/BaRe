name: Mirror Firebase RTDB to Supabase

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: firebase-rtdb-supabase-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/firebase.database,https://www.googleapis.com/auth/userinfo.email

      - name: Read Firebase users and send snapshot
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_DB_URL: https://bare-6f8d6-default-rtdb.firebaseio.com
          MIRROR_URL: https://fbiazqbrkwovzrirnzpb.supabase.co/functions/v1/firebase-rtdb-github-mirror
          MIRROR_SECRET: ${{ secrets.RTDB_GITHUB_MIRROR_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MIRROR_SECRET" || { echo "Missing RTDB_GITHUB_MIRROR_SECRET repository secret"; exit 1; }
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "${FIREBASE_DB_URL}/users.json?access_token=${ACCESS_TOKEN}" \
            -o "$RUNNER_TEMP/firebase-users.json"
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          with open(os.path.join(os.environ["RUNNER_TEMP"], "firebase-users.json"), encoding="utf-8") as f:
              users = json.load(f)
          if users is None:
              users = {}
          if not isinstance(users, dict):
              raise SystemExit("Firebase /users is not an object; refusing sync")
          url = os.environ["MIRROR_URL"]
          secret = os.environ["MIRROR_SECRET"]
          run_id = os.environ.get("GITHUB_RUN_ID", "manual")
          for uid, payload in users.items():
              if not isinstance(uid, str) or not uid or len(uid) > 128:
                  raise SystemExit("Invalid Firebase UID; refusing sync")
              body = json.dumps({
                  "user_id": uid,
                  "payload": payload,
                  "source_event_id": f"github-actions-{run_id}-{uid}",
                  "source_updated_at": None
              }).encode()
              req = urllib.request.Request(url, data=body, method="POST", headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + secret
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      if resp.status not in (200, 202):
                          raise SystemExit(f"Mirror endpoint returned HTTP {resp.status}")
              except urllib.error.HTTPError as e:
                  raise SystemExit(f"Mirror rejected UID snapshot with HTTP {e.code}; response body withheld")
          print(f"Successfully queued full snapshots for {len(users)} Firebase users.")
          PY
