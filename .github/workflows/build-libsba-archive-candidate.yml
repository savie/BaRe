name: Build libsba_archive.so candidate from tools

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/libsba-archive-cpp/**"
      - ".github/workflows/build-libsba-archive-candidate.yml"

permissions:
  contents: read

jobs:
  sba1-format-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build and run SBA1 header/footer parser tests
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror \
            tools/libsba-archive-cpp/src/sba1_format.cpp \
            tools/libsba-archive-cpp/tests/sba1_format_test.cpp \
            -o /tmp/sba1-format-test
          /tmp/sba1-format-test

  argon2-kat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and run pinned Argon2id known-answer tests
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 20190702 https://github.com/P-H-C/phc-winner-argon2.git /tmp/phc-winner-argon2
          cc -std=c99 -O2 -DARGON2_NO_THREADS \
            -I/tmp/phc-winner-argon2/include -I/tmp/phc-winner-argon2/src \
            /tmp/phc-winner-argon2/src/argon2.c \
            /tmp/phc-winner-argon2/src/core.c \
            /tmp/phc-winner-argon2/src/encoding.c \
            /tmp/phc-winner-argon2/src/ref.c \
            /tmp/phc-winner-argon2/src/blake2/blake2b.c \
            tools/libsba-archive-cpp/tests/argon2id_kat.c \
            -o /tmp/argon2id_kat
          /tmp/argon2id_kat

  aegis-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned libaegis and test AEGIS-256/128X2 authentication
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/aegis-aead/libaegis.git /tmp/libaegis
          git -C /tmp/libaegis checkout 0bb16395782de7d3b0ec28735c5e7e09e6551c93
          cmake -S /tmp/libaegis -B /tmp/libaegis-build -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/libaegis-build --parallel 2
          cc -std=c99 -O2 -I/tmp/libaegis/src/include \
            tools/libsba-archive-cpp/tests/aegis_smoke.c \
            /tmp/libaegis-build/libaegis.a -o /tmp/aegis-smoke
          /tmp/aegis-smoke

  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Inspect legacy-only JNI exports (temporary protocol recovery)
        if: ${{ matrix.abi == 'x86_64' }}
        shell: bash
        run: |
          set -euo pipefail
          NDK_BIN="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ORIGINAL="bare-implementation/lib/x86_64/libsba_archive.so"
          for symbol in \
            Java_com_swiftapps_sba_SbaLibaegisCryptoNative_decryptAegis256ChunkedEntryFdRaw \
            Java_com_swiftapps_sba_SbaLibaegisCryptoNative_encryptAegis256ChunkedEntryFdRaw \
            Java_com_swiftapps_sba_SbaSwiftTarNative_createTarToFdWithWriteStatsRaw \
            Java_com_swiftapps_sba_SbaZstdNative_compressZstdFileToFdRaw; do
            echo "===== ORIGINAL DISASSEMBLY: $symbol (prologue) ====="
            "$NDK_BIN/llvm-objdump" -d --disassemble-symbols="$symbol" "$ORIGINAL" > "/tmp/$symbol.dis"
            sed -n '1,45p' "/tmp/$symbol.dis"
            echo "===== CALLS / CRYPTO / FD OPS: $symbol ====="
            grep -E 'callq|aegis|ZSTD|read@|write@|open@|close@|GetStringUTF|GetByteArray|GetIntArray|GetObjectArray' "/tmp/$symbol.dis" | tail -n 80 || true
          done
          echo "===== AEGIS-256 DECRYPT INNER CALL WINDOWS ====="
          for addr in 72818 72980 72a4a 72a5f 72a6e 72aaf; do
            line=$(grep -nE "^[[:space:]]*$addr:" /tmp/Java_com_swiftapps_sba_SbaLibaegisCryptoNative_decryptAegis256ChunkedEntryFdRaw.dis | sed -n '1p' | cut -d: -f1)
            if [ -n "$line" ]; then start=$((line>18?line-18:1)); end=$((line+18)); sed -n "${start},${end}p" /tmp/Java_com_swiftapps_sba_SbaLibaegisCryptoNative_decryptAegis256ChunkedEntryFdRaw.dis; fi
          done
          echo "===== ZSTD FILE WRAPPER INNER CALL WINDOW ====="
          line=$(grep -nE '5fba9:' /tmp/Java_com_swiftapps_sba_SbaZstdNative_compressZstdFileToFdRaw.dis | sed -n '1p' | cut -d: -f1)
          if [ -n "$line" ]; then start=$((line>25?line-25:1)); end=$((line+20)); sed -n "${start},${end}p" /tmp/Java_com_swiftapps_sba_SbaZstdNative_compressZstdFileToFdRaw.dis; fi
          echo "===== ORIGINAL INTERNAL AEGIS SYMBOLS ====="
          "$NDK_BIN/llvm-nm" -C "$ORIGINAL" 2>/dev/null | grep -Ei 'aegis(128x2|256).*decrypt|aegis(128x2|256).*encrypt' | sed -n '1,30p' || true
      - name: Build candidate and stage into a disposable build copy only
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          # Snapshot the checked-in original. Never write to bare-implementation.
          mkdir -p artifacts/"$ABI" build
          ORIGINAL="bare-implementation/lib/$ABI/libsba_archive.so"
          if test -f "$ORIGINAL"; then
            sha256sum "$ORIGINAL" | tee "build/original-$ABI.sha256"
          else
            echo "Missing original library: $ORIGINAL" >&2
            exit 1
          fi

          cmake -S tools/libsba-archive-cpp -B "build/libsba-cpp/$ABI" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "build/libsba-cpp/$ABI" --parallel 2
          CANDIDATE="build/libsba-cpp/$ABI/libsba_archive.so"
          test -s "$CANDIDATE"

          "$NDK_BIN/llvm-readelf" -h "$CANDIDATE"
          "$NDK_BIN/llvm-readelf" -Ws "$CANDIDATE" > "artifacts/$ABI/jni-symbols.txt"
          "$NDK_BIN/llvm-readelf" -d "$CANDIDATE" > "artifacts/$ABI/jni-dynamic.txt"
          "$NDK_BIN/llvm-readelf" -Ws "$ORIGINAL" > "artifacts/$ABI/original-jni-symbols.txt"
          strings "$ORIGINAL" | grep -Ei 'version|sba|aegis|argon|zstd|tar|archive|invalid|unsupported|failed|error' | sort -u > "artifacts/$ABI/original-relevant-strings.txt" || true
          strings "$ORIGINAL" | sort -u > "artifacts/$ABI/original-all-strings.txt"
          grep -oE 'Java_[[:alnum:]_]+' "artifacts/$ABI/original-jni-symbols.txt" | sort -u > "artifacts/$ABI/original-jni-exports.txt"
          grep -oE 'Java_[[:alnum:]_]+' "artifacts/$ABI/jni-symbols.txt" | sort -u > "artifacts/$ABI/candidate-jni-exports.txt"
          comm -23 "artifacts/$ABI/original-jni-exports.txt" "artifacts/$ABI/candidate-jni-exports.txt" > "artifacts/$ABI/missing-original-jni-exports.txt"
          comm -13 "artifacts/$ABI/original-jni-exports.txt" "artifacts/$ABI/candidate-jni-exports.txt" > "artifacts/$ABI/extra-candidate-jni-exports.txt"
          ORIGINAL_EXPORT_COUNT=$(wc -l < "artifacts/$ABI/original-jni-exports.txt")
          printf 'Original JNI exports: %s\n' "$ORIGINAL_EXPORT_COUNT"
          if test "$ORIGINAL_EXPORT_COUNT" -ne 20; then
            echo "Expected 20 original JNI exports for $ABI, found $ORIGINAL_EXPORT_COUNT" >&2
            exit 1
          fi
          grep -q 'Java_com_swiftapps_sba_SbaLibaegisCryptoNative_isAvailable' "artifacts/$ABI/original-jni-exports.txt"
          printf 'Candidate JNI exports: '; wc -l < "artifacts/$ABI/candidate-jni-exports.txt"
          printf 'Missing original JNI exports: '; wc -l < "artifacts/$ABI/missing-original-jni-exports.txt"
          if test -s "artifacts/$ABI/missing-original-jni-exports.txt"; then
            echo "Candidate is missing one or more original JNI entry points." >&2
            cat "artifacts/$ABI/missing-original-jni-exports.txt" >&2
            exit 1
          fi
          if test -s "artifacts/$ABI/extra-candidate-jni-exports.txt"; then
            echo "Candidate has unexpected JNI exports." >&2
            cat "artifacts/$ABI/extra-candidate-jni-exports.txt" >&2
            exit 1
          fi
          CANDIDATE_EXPORT_COUNT=$(wc -l < "artifacts/$ABI/candidate-jni-exports.txt")
          if test "$CANDIDATE_EXPORT_COUNT" -ne 20; then
            echo "Expected exactly 20 candidate JNI exports for $ABI, found $CANDIDATE_EXPORT_COUNT" >&2
            exit 1
          fi
          grep -q 'Java_com_swiftapps_sba_SbaZstdNative_compressZstdBytes' "artifacts/$ABI/jni-symbols.txt"
          grep -q 'Java_com_swiftapps_sba_SbaZstdNative_decompressZstdBytes' "artifacts/$ABI/jni-symbols.txt"
          grep -q 'Java_com_swiftapps_sba_SbaZstdNative_decompressZstdFdToFdRaw' "artifacts/$ABI/jni-symbols.txt"
          grep -q 'Java_com_swiftapps_sba_SbaSwiftTarNative_listTarEntriesFromFdRaw' "artifacts/$ABI/jni-symbols.txt"
          grep -q 'Java_com_swiftapps_sba_SbaSwiftTarNative_listTarEntriesZstdFromFdRaw' "artifacts/$ABI/jni-symbols.txt"
          grep -q 'Java_com_swiftapps_sba_SbaNativeCrypto_deriveArgon2id' "artifacts/$ABI/jni-symbols.txt"
          grep -q 'Java_com_swiftapps_sba_SbaLibaegisCryptoNative_isAvailable' "artifacts/$ABI/jni-symbols.txt"

          # Mirror the native-lib workflow's isolation model: only build-src is staged.
          cp -a bare-implementation "build-src-$ABI"
          install -m 0644 "$CANDIDATE" "build-src-$ABI/lib/$ABI/libsba_archive.so"
          cp "build-src-$ABI/lib/$ABI/libsba_archive.so" "artifacts/$ABI/libsba_archive.so"
          # Include an audit copy of the original so its native implementation can be disassembled offline.
          cp "$ORIGINAL" "artifacts/$ABI/original-libsba_archive.so"
          "$NDK_BIN/llvm-objdump" -d --demangle --disassemble-symbols=Java_com_swiftapps_sba_SbaRuntimeNative_version "$ORIGINAL" > "artifacts/$ABI/original-version-disassembly.txt"
          printf 'ABI=%s\nGIT_SHA=%s\nORIGINAL_SHA256=' "$ABI" "$GITHUB_SHA" > "artifacts/$ABI/BUILD-METADATA.txt"
          cat "build/original-$ABI.sha256" >> "artifacts/$ABI/BUILD-METADATA.txt"
          sha256sum "artifacts/$ABI/libsba_archive.so" | tee "artifacts/$ABI/SHA256SUMS.txt"

          # Prove the tracked original was not replaced or modified.
          sha256sum --check "build/original-$ABI.sha256"
      - name: Upload isolated candidate library
        uses: actions/upload-artifact@v4
        with:
          name: libsba-archive-candidate-${{ matrix.abi }}
          path: artifacts/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 14
