name: Validate BΛR☰ Backend Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - feature/namespace-barebackup
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/validate-backend-migration.yml"

permissions:
  contents: read

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/namespace-barebackup
          fetch-depth: 1

      - name: Validate migration structure and ownership policies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = sorted(Path("supabase/migrations").glob("*.sql"))
          assert files, "No Supabase migration files found"
          names = [p.name for p in files]
          assert len(names) == len(set(names)), "Duplicate migration file names found"

          destructive = re.compile(
              r"\b(drop\s+schema|drop\s+database|truncate\s+table)\b",
              re.IGNORECASE,
          )
          for path in files:
              sql = path.read_text()
              assert not destructive.search(sql), f"Unapproved destructive operation in {path}"
              print(f"Checked {path}")

          ownership_migration = Path(
              "supabase/migrations/20261024020000_firebase_uid_text_and_sub_rls.sql"
          )
          assert ownership_migration.exists(), "Firebase UID ownership migration missing"
          normalized = re.sub(r"\s+", " ", ownership_migration.read_text().lower())
          tables = [
              "profiles", "devices", "backup_records", "backup_versions",
              "folder_configs", "backup_schedules", "app_settings", "sync_state",
          ]
          assert "auth.jwt()->>'sub'" in normalized, "RLS must bind ownership to the JWT subject"
          for table in tables:
              alter = f"alter table public.{table} alter column user_id type text"
              policy = f'create policy "{table} own rows" on public.{table} for all to authenticated'
              assert alter in normalized, f"{table}: Firebase UID text migration missing"
              assert policy in normalized, f"{table}: ownership policy declaration missing"
              start = normalized.index(policy)
              next_policy = normalized.find("create policy ", start + len(policy))
              body = normalized[start: next_policy if next_policy >= 0 else len(normalized)]
              assert "using (" in body and "with check (" in body, (
                  f"{table}: RLS policy must check row ownership on read and write"
              )
              assert body.count("auth.jwt()->>'sub'") >= 2, (
                  f"{table}: RLS must bind both USING and WITH CHECK to JWT subject"
              )
          print(f"Validated {len(files)} migration files and ownership RLS coverage.")
          PY
