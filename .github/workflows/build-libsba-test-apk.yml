name: Build libsba candidate test APK ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/libsba-archive-cpp/**"
      - "tools/native-jni-replacement/**"
      - "tools/prepare-barebackup-build.py"
      - "app/google-services.json"
      - ".github/workflows/build-libsba-archive-candidate.yml"
      - ".github/workflows/build-libsba-test-apk.yml"
      - "bare-implementation/**"

permissions:
  contents: read
  actions: read

# Keep only the newest candidate APK build for this branch active.
concurrency:
  group: libsba-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-candidate:
    name: Build candidate (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build candidate and verify original is untouched
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ORIGINAL="bare-implementation/lib/$ABI/libsba_archive.so"
          test -s "$ORIGINAL"
          mkdir -p "artifacts/$ABI" "build/libsba-cpp"

          sha256sum "$ORIGINAL" > "build/original-$ABI.sha256"
          cmake -S tools/libsba-archive-cpp -B "build/libsba-cpp/$ABI" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ABI" \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "build/libsba-cpp/$ABI" --parallel 2

          CANDIDATE="build/libsba-cpp/$ABI/libsba_archive.so"
          test -s "$CANDIDATE"
          "$NDK_BIN/llvm-readelf" -h "$CANDIDATE" > "artifacts/$ABI/ELF-HEADER.txt"
          "$NDK_BIN/llvm-readelf" -Ws "$CANDIDATE" > "artifacts/$ABI/JNI-SYMBOLS.txt"
          grep -q 'Java_com_swiftapps_sba_SbaZstdNative_compressZstdBytes' "artifacts/$ABI/JNI-SYMBOLS.txt"
          grep -q 'Java_com_swiftapps_sba_SbaNativeCrypto_deriveArgon2id' "artifacts/$ABI/JNI-SYMBOLS.txt"

          install -m 0644 "$CANDIDATE" "artifacts/$ABI/libsba_archive.so"

          # Rebuild libnative-lib.so with the same source/toolchain contract as
          # namespace-barebackup.yml, but keep this workflow completely standalone.
          test -s tools/native-jni-replacement/native-lib.cpp
          "$NDK_BIN/clang++" --target="$(case "$ABI" in
            arm64-v8a) echo aarch64-linux-android24 ;;
            armeabi-v7a) echo armv7a-linux-androideabi24 ;;
            x86) echo i686-linux-android24 ;;
            x86_64) echo x86_64-linux-android24 ;;
            *) echo "Unsupported ABI: $ABI" >&2; exit 1 ;;
          esac)" -fPIC -shared -std=c++17 -O2 \
            -Wall -Wextra -Werror=return-type -static-libstdc++ \
            tools/native-jni-replacement/native-lib.cpp \
            -o "artifacts/$ABI/libnative-lib.so" \
            -landroid -ldl -llog
          "$NDK_BIN/llvm-readelf" -Ws "artifacts/$ABI/libnative-lib.so" > "artifacts/$ABI/NATIVE-JNI-SYMBOLS.txt"
          "$NDK_BIN/llvm-readelf" -d "artifacts/$ABI/libnative-lib.so" > "artifacts/$ABI/NATIVE-DYNAMIC.txt"
          if grep -q 'NEEDED.*libc++_shared\\.so' "artifacts/$ABI/NATIVE-DYNAMIC.txt"; then
            echo "Unexpected libc++_shared.so dependency in reconstructed libnative-lib.so ($ABI)" >&2
            exit 1
          fi
          if grep -q 'JNI_OnLoad' "artifacts/$ABI/NATIVE-JNI-SYMBOLS.txt"; then
            echo "Unexpected JNI_OnLoad in reconstructed libnative-lib.so ($ABI)" >&2
            exit 1
          fi
          grep -q 'Java_org_swiftapps_swiftbackup_SwiftApp_getGoogleAuthAndroidClientId' "artifacts/$ABI/NATIVE-JNI-SYMBOLS.txt"
          grep -q 'Java_org_swiftapps_swiftbackup_SwiftApp_getGoogleAuthWebClientId' "artifacts/$ABI/NATIVE-JNI-SYMBOLS.txt"
          grep -q 'Java_org_swiftapps_swiftbackup_SwiftApp_isLocalNetworkTcpBlockedByPermission' "artifacts/$ABI/NATIVE-JNI-SYMBOLS.txt"

          sha256sum "artifacts/$ABI/libsba_archive.so" "artifacts/$ABI/libnative-lib.so" > "artifacts/$ABI/SHA256SUMS.txt"
          sha256sum --check "build/original-$ABI.sha256"

      - name: Upload candidate library for APK assembly
        uses: actions/upload-artifact@v4
        with:
          name: libsba-apk-candidate-${{ matrix.abi }}
          path: artifacts/${{ matrix.abi }}/
          if-no-files-found: error
          retention-days: 7

  package-test-apk:
    name: Assemble and package test APK
    runs-on: ubuntu-latest
    needs: build-candidate
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;35.0.0"

      - name: Download candidate libraries for all ABIs
        uses: actions/download-artifact@v4
        with:
          name: libsba-apk-candidate-arm64-v8a
          path: build/candidates/arm64-v8a
      - uses: actions/download-artifact@v4
        with:
          name: libsba-apk-candidate-armeabi-v7a
          path: build/candidates/armeabi-v7a
      - uses: actions/download-artifact@v4
        with:
          name: libsba-apk-candidate-x86
          path: build/candidates/x86
      - uses: actions/download-artifact@v4
        with:
          name: libsba-apk-candidate-x86_64
          path: build/candidates/x86_64

      - name: Download Apktool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
            --output apktool.jar
          java -jar apktool.jar --version

      - name: Stage candidate libraries in disposable source copy
        shell: bash
        run: |
          set -euo pipefail
          cp -a bare-implementation build-src
          mkdir -p build
          cp app/google-services.json build/google-services.json
          python3 tools/prepare-barebackup-build.py

          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            test -s "build/candidates/$abi/libsba_archive.so"
            test -s "build/candidates/$abi/libnative-lib.so"
            install -m 0644 "build/candidates/$abi/libsba_archive.so" \
              "build-src/lib/$abi/libsba_archive.so"
            install -m 0644 "build/candidates/$abi/libnative-lib.so" \
              "build-src/lib/$abi/libnative-lib.so"
          done

          # The repository's original libraries are never overwritten.
          sha256sum bare-implementation/lib/*/libsba_archive.so > build/original-sba-sha256.txt
          sha256sum --check build/original-sba-sha256.txt

      - name: Rebuild APK with candidate libsba_archive.so
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          java -jar apktool.jar b build-src --use-aapt2 --output build/libsba-candidate-unsigned.apk
          test -s build/libsba-candidate-unsigned.apk
          unzip -t build/libsba-candidate-unsigned.apk
          ls -lh build/libsba-candidate-unsigned.apk

      - name: Verify candidate native libraries are embedded byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import zipfile

          apk = "build/libsba-candidate-unsigned.apk"
          abis = ("arm64-v8a", "armeabi-v7a", "x86", "x86_64")
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              for abi in abis:
                  for library in ("libsba_archive.so", "libnative-lib.so"):
                      entry = f"lib/{abi}/{library}"
                      assert entry in names, f"APK missing {entry}"
                      embedded = hashlib.sha256(archive.read(entry)).hexdigest()
                      with open(f"build/candidates/{abi}/{library}", "rb") as f:
                          candidate = hashlib.sha256(f.read()).hexdigest()
                      assert embedded == candidate, f"Embedded candidate mismatch for {abi}/{library}"
                      print(f"{abi}/{library}: embedded SHA-256 {embedded}")
          PY

      - name: Sign test APK with a throwaway test key
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/libsba-test.keystore" \
            -storepass changeit -keypass changeit -alias libsba-test \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=BaRe libsba candidate test, OU=Experimental, O=BaRe, C=ID"

          "$BUILD_TOOLS/zipalign" -f 4 \
            build/libsba-candidate-unsigned.apk build/libsba-candidate-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/libsba-test.keystore" \
            --ks-key-alias libsba-test --ks-pass pass:changeit --key-pass pass:changeit \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out build/BaRe-libsba-candidate-test.apk build/libsba-candidate-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/BaRe-libsba-candidate-test.apk
          unzip -t build/BaRe-libsba-candidate-test.apk

      - name: Create ZIP containing APK and test metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/package
          cp build/BaRe-libsba-candidate-test.apk build/package/
          {
            echo "Project: BΛR☰ / BaRe"
            echo "Artifact type: experimental candidate APK; not a production release"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Native library: custom tools/libsba-archive-cpp candidate"
            echo "Startup library: rebuilt from tools/native-jni-replacement/native-lib.cpp"
            echo "ABIs: arm64-v8a, armeabi-v7a, x86, x86_64"
            echo "Signing: ephemeral CI test key; this APK cannot upgrade a release signed by another key"
            echo "Compatibility: JNI export presence does not establish behavioral parity."
            echo "Known limitation: archive creation and AEGIS chunk operations remain incomplete."
          } > build/package/README-TEST.txt
          (
            cd build/package
            sha256sum BaRe-libsba-candidate-test.apk > SHA256SUMS.txt
            zip -9 "../BaRe-libsba-candidate-test.zip" \
              BaRe-libsba-candidate-test.apk README-TEST.txt SHA256SUMS.txt
          )
          unzip -t build/BaRe-libsba-candidate-test.zip
          unzip -l build/BaRe-libsba-candidate-test.zip
          sha256sum build/BaRe-libsba-candidate-test.zip

      - name: Upload test APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BaRe-libsba-candidate-test-APK-ZIP
          path: build/BaRe-libsba-candidate-test.zip
          if-no-files-found: error
          retention-days: 7
