plugins {
    id "com.android.application"
}

android {
    namespace "org.swiftapps.swiftbackup"
    compileSdk 37

    defaultConfig {
        applicationId "org.swiftapps.swiftbackup"
        minSdk 26
        targetSdk 37
        versionCode 620
        versionName "5.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def ciKeystorePath = System.getenv("BARE_SIGNING_KEYSTORE")

    if (ciKeystorePath && file(ciKeystorePath).exists()) {
        signingConfigs {
            ci {
                storeFile file(ciKeystorePath)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }

        buildTypes {
            debug {
                signingConfig signingConfigs.ci
            }
        }
    }

    // Reference-backed source-set boundary: these packages are supplied by the
    // exact Maven artifacts below, while the remaining third-party Reference
    // families stay embedded in the reconstructed source tree.
    sourceSets {
        main {
            java {
                exclude "android/**"
                exclude "android/support/**"
                exclude "androidx/credentials/**"
                exclude "androidx/preference/**"
                exclude "androidx/recyclerview/widget/GridLayoutManager.java"
                exclude "androidx/recyclerview/widget/LinearLayoutManager.java"
                exclude "androidx/recyclerview/widget/RecyclerView.java"
                exclude "androidx/recyclerview/widget/StaggeredGridLayoutManager.java"
                exclude "org/xmlpull/**"
                exclude "com/android/billingclient/**"
                exclude "com/google/android/datatransport/**"
                exclude "com/google/android/gms/**"
                exclude "com/google/android/play/core/**"
                exclude "com/google/android/recaptcha/internal/**"
                exclude "com/microsoft/identity/**"
                exclude "com/jcraft/jsch/PageantConnector.java"
                exclude "com/jcraft/jsch/Log4j2Logger.java"
                exclude "net/openid/appauth/**"
                exclude "moe/shizuku/**"
                exclude "rikka/shizuku/**"
            }
        }
    }
}

def libcoreIoStubSourceDir = file("$rootDir/gradle/libcore-io-stubs/src")
def libcoreIoStubClassesDir = layout.buildDirectory.dir("libcore-io-stubs/classes")
def libcoreIoStubJarDir = layout.buildDirectory.dir("libcore-io-stubs")
def libcoreIoStubJar = layout.buildDirectory.file("libcore-io-stubs/libcore-io-stubs.jar")

def jgssStubSourceDir = file("$rootDir/gradle/jgss-api-stubs/src")
def javaxElStubSourceDir = file("$rootDir/gradle/javax-el-api-stubs/src")
def jgssStubClassesDir = layout.buildDirectory.dir("jgss-api-stubs/classes")
def jgssStubJarDir = layout.buildDirectory.dir("jgss-api-stubs")
def jgssStubJar = layout.buildDirectory.file("jgss-api-stubs/jgss-api-stubs.jar")
def javaxElStubClassesDir = layout.buildDirectory.dir("javax-el-api-stubs/classes")
def javaxElStubJarDir = layout.buildDirectory.dir("javax-el-api-stubs")
def javaxElStubJar = layout.buildDirectory.file("javax-el-api-stubs/javax-el-api-stubs.jar")

tasks.register("compileLibcoreIoStubs", JavaCompile) {
    source fileTree(libcoreIoStubSourceDir)
    destinationDirectory.set(libcoreIoStubClassesDir)
    classpath = files()
    sourceCompatibility = "8"
    targetCompatibility = "8"
}

tasks.register("jarLibcoreIoStubs", Jar) {
    dependsOn("compileLibcoreIoStubs")
    archiveFileName = "libcore-io-stubs.jar"
    destinationDirectory.set(libcoreIoStubJarDir)
    from(libcoreIoStubClassesDir)
}

tasks.register("compileJgssApiStubs", JavaCompile) {
    source fileTree(jgssStubSourceDir)
    destinationDirectory.set(jgssStubClassesDir)
    classpath = files()
    sourceCompatibility = "8"
    targetCompatibility = "8"
}

tasks.register("compileJavaxElApiStubs", JavaCompile) {
    source fileTree(javaxElStubSourceDir)
    destinationDirectory.set(javaxElStubClassesDir)
    classpath = files()
    sourceCompatibility = "8"
    targetCompatibility = "8"
}

tasks.register("jarJavaxElApiStubs", Jar) {
    dependsOn("compileJavaxElApiStubs")
    archiveFileName = "javax-el-api-stubs.jar"
    destinationDirectory.set(javaxElStubJarDir)
    from(javaxElStubClassesDir)
}

tasks.register("jarJgssApiStubs", Jar) {
    dependsOn("compileJgssApiStubs")
    archiveFileName = "jgss-api-stubs.jar"
    destinationDirectory.set(jgssStubJarDir)
    from(jgssStubClassesDir)
}

tasks.matching { it.name == "compileDebugJavaWithJavac" }.configureEach {
    dependsOn("jarJgssApiStubs", "jarJavaxElApiStubs", "jarLibcoreIoStubs")
}

dependencies {
    compileOnly "androidx.performance:performance-unsafe:1.0.0-alpha01"
    compileOnly files(libcoreIoStubJar)
    compileOnly files(jgssStubJar)
    compileOnly files(javaxElStubJar)
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.core:core:1.18.0"
    implementation "androidx.fragment:fragment:1.8.9"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.profileinstaller:profileinstaller:1.4.0"
    implementation "androidx.room:room-runtime:2.8.4"
    implementation "androidx.startup:startup-runtime:1.2.0"

    implementation("com.microsoft.identity.client:msal:8.3.2") {
        // Reference contains com.microsoft.device.display as embedded source.
        exclude group: "com.microsoft.device.display", module: "display-mask"
    }
    implementation "com.android.billingclient:billing:8.3.0"
    implementation "com.pcloud.sdk:android:1.11.0"
    implementation "com.google.firebase:firebase-auth:24.1.0"
    implementation "com.google.firebase:firebase-database:22.0.1"
    implementation "com.google.firebase:firebase-crashlytics:20.0.6"
    implementation "com.google.firebase:firebase-sessions:3.0.6"
    implementation "com.google.android.gms:play-services-auth:21.5.1"
    implementation "com.google.android.gms:play-services-fido:21.0.0"
    implementation "com.google.android.gms:play-services-identity-credentials:16.0.0-alpha08"
    implementation "com.google.android.play:core-common:2.0.3"
    implementation "com.google.android.play:integrity:1.3.0"
    implementation "com.google.android.datatransport:transport-runtime:3.3.0"

    implementation "net.openid:appauth:0.11.1"
    implementation "com.google.android.recaptcha:recaptcha:18.6.1"
    implementation "org.bouncycastle:bctls-jdk18on:1.85"
    implementation "org.bouncycastle:bcpkix-jdk18on:1.85"
    implementation "org.bouncycastle:bcprov-jdk18on:1.85"
    implementation "org.conscrypt:conscrypt-android:2.5.2"
    implementation "com.kohlschutter.junixsocket:junixsocket-common:2.10.1"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"

    // Reference-embedded third-party families intentionally remain source-owned:
    // YubiKit, JSch, Nimbus, Gson, OkHttp/Okio, Bouncy Castle,
    // CommonMark, zstd, Glide, Lottie, EventBus, etc.
    implementation "io.github.ParkSangGwon:tedpermission:3.4.2"
    implementation "com.google.crypto.tink:tink-android:1.23.0"
    implementation "org.commonmark:commonmark-ext-gfm-strikethrough:0.29.0"
    implementation "com.github.luben:zstd-jni:1.5.7-12@aar"
}
