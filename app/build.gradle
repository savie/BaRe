plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

android {
    namespace "com.bareapps.barebackup"
    compileSdk 37
    ndkVersion "27.2.12479018"

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        debug {
            // Keep the instrumentation target unshrunk: AndroidX's test runner resolves
            // Kotlin runtime APIs dynamically before test discovery, so R8 must not remove
            // classes such as kotlin.LazyKt. Release remains minified and resource-shrunk.
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    defaultConfig {
        // Supply with -PSUPABASE_URL / -PSUPABASE_PUBLISHABLE_KEY or environment variables.
        def supabaseUrl = providers.gradleProperty("SUPABASE_URL")
                .orElse(providers.environmentVariable("SUPABASE_URL")
                .orElse("https://fbiazqbrkwovzrirnzpb.supabase.co")).get()
        def supabasePublishableKey = providers.gradleProperty("SUPABASE_PUBLISHABLE_KEY")
                .orElse(providers.environmentVariable("SUPABASE_PUBLISHABLE_KEY")
                .orElse("sb_publishable_qTDGXWoCW79yAL0jyO27mw_MPJY_Ryi")).get()
        buildConfigField "String", "SUPABASE_URL", '"' + supabaseUrl + '"'
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", '"' + supabasePublishableKey + '"'
        applicationId "com.bareapps.barebackup"
        minSdk 26
        targetSdk 37
        versionCode providers.environmentVariable("GITHUB_RUN_NUMBER").orElse("1").get().toInteger()
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }
}

// Optional direct oracle test against the exact SwiftBackup native implementation.
// The proprietary reference library is extracted only into build/ from a user-supplied APK;
// it is never checked into the repository or included in release APKs.
def swiftBackupReferenceApk = providers.gradleProperty("swiftbackupReferenceApk")
def swiftBackupReferenceAssets = layout.buildDirectory.dir("generated/swiftbackupReferenceAssets")
android.sourceSets.androidTest.assets.srcDir(swiftBackupReferenceAssets)
if (swiftBackupReferenceApk.isPresent()) {
    def referenceAsset = swiftBackupReferenceAssets.map { it.file("reference/libsba_archive.so") }
    def extractSwiftBackupReferenceAegis = tasks.register("extractSwiftBackupReferenceAegis") {
        inputs.file(file(swiftBackupReferenceApk.get()))
        outputs.file(referenceAsset)
        doLast {
            def apkFile = file(swiftBackupReferenceApk.get())
            if (!apkFile.isFile()) throw new GradleException("SwiftBackup reference APK not found: " + apkFile)
            def apk = new java.util.zip.ZipFile(apkFile)
            try {
                def entry = apk.getEntry("lib/x86_64/libsba_archive.so")
                if (entry == null) throw new GradleException("Reference APK has no x86_64/libsba_archive.so")
                byte[] bytes = apk.getInputStream(entry).withCloseable { it.bytes }
                byte[] oldName = "libsba_archive.so".getBytes(java.nio.charset.StandardCharsets.US_ASCII)
                byte[] newName = "libref_archive.so".getBytes(java.nio.charset.StandardCharsets.US_ASCII)
                if (oldName.length != newName.length) throw new GradleException("Reference SONAME patch lengths differ")
                int matches = 0
                for (int i = 0; i <= bytes.length - oldName.length; i++) {
                    boolean match = true
                    for (int j = 0; j < oldName.length; j++) {
                        if (bytes[i + j] != oldName[j]) { match = false; break }
                    }
                    if (match) {
                        System.arraycopy(newName, 0, bytes, i, newName.length)
                        matches++
                        i += oldName.length - 1
                    }
                }
                if (matches == 0) throw new GradleException("Could not isolate reference library SONAME")
                def output = referenceAsset.get().asFile
                output.parentFile.mkdirs()
                output.bytes = bytes
            } finally {
                apk.close()
            }
        }
    }
    tasks.named("mergeDebugAndroidTestAssets").configure {
        dependsOn(extractSwiftBackupReferenceAegis)
    }
}

