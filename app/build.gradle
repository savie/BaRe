plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bareapps.barebackup'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bareapps.barebackup'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // This checkout contains legacy/reference resource directories. Keep them intact in Git,
    // but never package them into the independent BΛR☰ application.
    sourceSets {
        main {
            res.srcDirs = []
            assets.srcDirs = []
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
    testImplementation 'junit:junit:4.13.2'
}
