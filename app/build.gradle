plugins {
    id "com.android.application"
}

android {
    namespace "org.swiftapps.swiftbackup"
    compileSdk 37

    defaultConfig {
        applicationId "org.swiftapps.swiftbackup"
        minSdk 26
        targetSdk 37
        versionCode 620
        versionName "5.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Reference-evidenced AndroidX families. Exact inclusion will be reduced/expanded
    // against actual source usage before claiming dependency parity.
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.core:core:1.18.0"
    implementation "androidx.fragment:fragment:1.8.9"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "androidx.profileinstaller:profileinstaller:1.4.0"
    implementation "androidx.room:room-runtime:2.8.4"
    implementation "androidx.startup:startup-runtime:1.2.0"
    implementation "com.google.android.material:material:1.14.0"

    // Strong Reference identity matches; build resolution is still unverified.
    implementation "com.microsoft.identity.client:msal:8.3.2"
    implementation "com.android.billingclient:billing:8.3.0"
    implementation "com.pcloud.sdk:android:1.11.0"

    // Remaining external dependency families are intentionally NOT fabricated here.
    // See docs/phase_2-dependency-register.md and docs/phase_2-dependency-map.md.
}
