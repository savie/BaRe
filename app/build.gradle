plugins {
    id "com.android.application"
}

android {
    namespace "com.bareapps.barebackup"
    compileSdk 37

    buildFeatures {
        aidl true
        buildConfig true
    }

    defaultConfig {
        def supabaseUrl = providers.gradleProperty("SUPABASE_URL")
                .orElse(providers.environmentVariable("SUPABASE_URL")
                .orElse("https://fbiazqbrkwovzrirnzpb.supabase.co")).get()
        def supabasePublishableKey = providers.gradleProperty("SUPABASE_PUBLISHABLE_KEY")
                .orElse(providers.environmentVariable("SUPABASE_PUBLISHABLE_KEY")
                .orElse("sb_publishable_qTDGXWoCW79yAL0jyO27mw_MPJY_Ryi")).get()
        buildConfigField "String", "SUPABASE_URL", '"' + supabaseUrl + '"'
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", '"' + supabasePublishableKey + '"'
        applicationId "com.bareapps.barebackup"
        minSdk 26
        targetSdk 37
        versionCode providers.environmentVariable("GITHUB_RUN_NUMBER").orElse("1").get().toInteger()
        versionName "1.0.1"
    }
}

dependencies {
    // AndroidX and Material components referenced by the existing XML layouts in rewrite.
    implementation "androidx.core:core-ktx:1.16.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation "androidx.fragment:fragment-ktx:1.8.8"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.3.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.viewpager:viewpager:1.1.0"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "com.google.android.material:material:1.13.0"

    // Shizuku/Sui and root shell integrations used by the backup feature set.
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "com.github.topjohnwu.libsu:core:6.0.0"
}
