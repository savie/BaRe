plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

android {
    namespace "com.bareapps.barebackup"
    compileSdk 37

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    defaultConfig {
        // Supply with -PSUPABASE_URL / -PSUPABASE_PUBLISHABLE_KEY or environment variables.
        def supabaseUrl = providers.gradleProperty("SUPABASE_URL")
                .orElse(providers.environmentVariable("SUPABASE_URL")
                .orElse("https://fbiazqbrkwovzrirnzpb.supabase.co")).get()
        def supabasePublishableKey = providers.gradleProperty("SUPABASE_PUBLISHABLE_KEY")
                .orElse(providers.environmentVariable("SUPABASE_PUBLISHABLE_KEY")
                .orElse("sb_publishable_qTDGXWoCW79yAL0jyO27mw_MPJY_Ryi")).get()
        buildConfigField "String", "SUPABASE_URL", '"' + supabaseUrl + '"'
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", '"' + supabasePublishableKey + '"'
        applicationId "com.bareapps.barebackup"
        minSdk 26
        targetSdk 37
        versionCode providers.environmentVariable("GITHUB_RUN_NUMBER").orElse("1").get().toInteger()
        versionName "1.0.1"
    }
}

dependencies {
    // Runtime widgets required by the reference onboarding layout.
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "com.google.android.material:material:1.13.0"
    // TedPermission runtime required by the reference manifest components.
    implementation "io.github.ParkSangGwon:tedpermission-normal:3.4.2"

    // Firebase Authentication is retained for compatibility with the SwiftBackup reference flow.
    implementation platform("com.google.firebase:firebase-bom:34.4.0")
    implementation "com.google.firebase:firebase-auth"

    // Shizuku/Sui API and manifest provider integration.
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"

    // Root shell execution; the user must still grant superuser access on supported devices.
    implementation "com.github.topjohnwu.libsu:core:6.0.0"
}
