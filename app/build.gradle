plugins {
    id 'com.android.application'
}

android {
    namespace = "com.bare"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.bare"
        minSdk = 26
        targetSdk = 37

        def bareVersionCode = System.getenv("BARE_VERSION_CODE")
        versionCode = bareVersionCode?.isInteger() ? bareVersionCode.toInteger() : 1
        versionName = "1.0"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    def stableDebugKeystorePath = System.getenv("BARE_DEBUG_KEYSTORE_PATH")
    if (stableDebugKeystorePath?.trim()) {
        signingConfigs {
            stableDebug {
                storeFile = file(stableDebugKeystorePath)
                storePassword = System.getenv("BARE_DEBUG_KEYSTORE_PASSWORD") ?: "android"
                keyAlias = System.getenv("BARE_DEBUG_KEY_ALIAS") ?: "androiddebugkey"
                keyPassword = System.getenv("BARE_DEBUG_KEY_PASSWORD") ?: "android"
            }
        }
        buildTypes {
            debug {
                signingConfig = signingConfigs.stableDebug
            }
        }
    }

    packaging {
        resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
    }
}

dependencies {
    implementation project(':native-compat')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'org.apache.commons:commons-compress:1.28.0'

    // Reference ZIP/APK dependency evidence:
    implementation 'com.microsoft.identity.client:msal:8.3.2'
    implementation 'com.pcloud.sdk:android:1.11.0'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.0'
    implementation 'com.android.billingclient:billing:8.3.0'
    implementation 'com.google.android.gms:play-services-auth:21.5.1'
    implementation 'com.google.android.datatransport:transport-runtime:3.3.0'
    implementation 'com.google.android.play:integrity:1.3.0'
}
