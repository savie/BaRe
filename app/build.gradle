plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
}

android {
    namespace "com.bareapps.barebackup"
    compileSdk 37

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    defaultConfig {
        // Supply with -PSUPABASE_URL / -PSUPABASE_PUBLISHABLE_KEY or environment variables.
        def supabaseUrl = providers.gradleProperty("SUPABASE_URL")
                .orElse(providers.environmentVariable("SUPABASE_URL")
                .orElse("https://fbiazqbrkwovzrirnzpb.supabase.co")).get()
        def supabasePublishableKey = providers.gradleProperty("SUPABASE_PUBLISHABLE_KEY")
                .orElse(providers.environmentVariable("SUPABASE_PUBLISHABLE_KEY")
                .orElse("sb_publishable_qTDGXWoCW79yAL0jyO27mw_MPJY_Ryi")).get()
        buildConfigField "String", "SUPABASE_URL", '"' + supabaseUrl + '"'
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", '"' + supabasePublishableKey + '"'
        applicationId "com.bareapps.barebackup"
        minSdk 26
        targetSdk 37
        versionCode providers.environmentVariable("GITHUB_RUN_NUMBER").orElse("1").get().toInteger()
        versionName "1.0.1"
    }
}

dependencies {
    // Explicit AndroidX/runtime libraries verified in the local SwiftBackup 5.1.0 (620)
    // APK's META-INF version metadata. Some may arrive transitively today; declaring them
    // explicitly keeps the reference runtime surface reproducible for parity work.
    implementation "androidx.activity:activity-ktx:1.13.0"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.core:core-ktx:1.18.0"
    implementation "androidx.drawerlayout:drawerlayout:1.1.1"
    implementation "androidx.emoji2:emoji2:1.3.0"
    implementation "androidx.exifinterface:exifinterface:1.3.6"
    implementation "androidx.fragment:fragment-ktx:1.8.9"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
    implementation "androidx.localbroadcastmanager:localbroadcastmanager:1.1.0"
    implementation "androidx.profileinstaller:profileinstaller:1.4.0"
    implementation "androidx.savedstate:savedstate-ktx:1.4.0"
    implementation "androidx.slidingpanelayout:slidingpanelayout:1.2.0"
    implementation "androidx.sqlite:sqlite-framework:2.6.2"
    implementation "androidx.startup:startup-runtime:1.2.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "androidx.transition:transition:1.5.0"
    implementation "androidx.viewpager:viewpager:1.0.0"
    implementation "androidx.window:window:1.0.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.11.0"

    // Runtime widgets required by the reference onboarding layout.
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation "com.google.android.material:material:1.14.0"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.datastore:datastore-preferences:1.1.7"
    implementation "androidx.webkit:webkit:1.16.0"
    implementation "androidx.viewpager2:viewpager2:1.1.0-beta02"
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.room:room-runtime:2.8.4"
    // TedPermission runtime required by the reference manifest components.
    implementation "io.github.ParkSangGwon:tedpermission-normal:3.4.2"

    // The reference manifest registers OkHttp's AndroidX Startup initializer.
    // Include the matching runtime class instead of removing the reference metadata.
    implementation "com.squareup.okhttp3:okhttp:5.1.0"

    // Firebase Authentication is retained for compatibility with the SwiftBackup reference flow.
    implementation platform("com.google.firebase:firebase-bom:34.4.0")
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-database"
    implementation "com.google.firebase:firebase-crashlytics"
    implementation "com.google.firebase:firebase-crashlytics-ndk"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.android.billingclient:billing:8.3.0"
    // Cloud/OAuth SDKs present in the SwiftBackup reference manifest.
    implementation "net.openid:appauth:0.11.1"
    implementation "com.microsoft.identity.client:msal:8.5.0"
    implementation "com.pcloud.sdk:android:1.11.0"
    implementation "com.yubico.yubikit:android:3.2.0"

    // Shizuku/Sui API and manifest provider integration.
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"

    // Root shell execution; the user must still grant superuser access on supported devices.
    implementation "com.github.topjohnwu.libsu:core:6.0.0"

    // Libraries confirmed present in the local SwiftBackup 5.1.0 (620) decompile.
    // The APK does not expose reliable version metadata for these artifacts; versions below
    // are conservative resolvable fallbacks, not claims of exact upstream version parity.
    implementation "com.github.bumptech.glide:glide:4.16.0"
    implementation "com.airbnb.android:lottie:6.6.2"
    implementation "com.github.mwiede:jsch:0.2.25"
    implementation "com.nimbusds:nimbus-jose-jwt:9.40"
    implementation "com.facebook.conceal:conceal:2.0.2"
    implementation "com.github.Ferfalk:SimpleSearchView:0.2.0"
    implementation "com.l4digital:fastscroll:2.1.0"
    implementation "com.github.warkiz.widget:indicatorseekbar:2.1.2"

}
